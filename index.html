<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stardust Hunter · Cyber Finale</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#05060f;font-family:'Share Tech Mono', system-ui, monospace;user-select:none;-webkit-tap-highlight-color:transparent;}
canvas{display:block;position:absolute;top:0;left:0; z-index: 1;} 

/* ===== 开屏动画 ===== */
#splashScreen{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#000;
  animation:splashBg 3s ease forwards;
}
@keyframes splashBg{
  0%{opacity:0}
  15%{opacity:1}
  85%{opacity:1}
  100%{opacity:0}
}
#splashScreen h1{
  font-family:'Orbitron',sans-serif;font-size:clamp(40px,9vw,110px);font-weight:900;
  letter-spacing:.18em;padding-left:.18em;
  color:#0ff;text-shadow:0 0 20px #0ff,0 0 50px #0ff,0 0 90px rgba(0,255,255,.6);
  animation:splashTitle 3s ease forwards;
  text-align:center;
}
@keyframes splashTitle{
  0%{transform:scale(.8);opacity:0}
  25%{transform:scale(1);opacity:1}
  85%{opacity:1}
  100%{opacity:0;transform:scale(1.05)}
}
#splashScreen p{
  margin-top:18px;font-family:'Orbitron',sans-serif;font-size:clamp(12px,2vw,20px);
  letter-spacing:.5em;padding-left:.5em;color:#a78bfa;text-shadow:0 0 12px #a78bfa;
  animation:splashSub 3s ease forwards;
}
@keyframes splashSub{
  0%{opacity:0;transform:translateY(10px)}
  30%{opacity:1;transform:translateY(0)}
  85%{opacity:1}
  100%{opacity:0}
}

/* ===== 特别鸣谢 ===== */
#thanksScreen{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 50%, rgba(251,191,36,.08), rgba(0,0,0,.98) 70%);
  animation:thanksBg 2.5s ease forwards;
}
@keyframes thanksBg{
  0%{opacity:0}
  20%{opacity:1}
  80%{opacity:1}
  100%{opacity:0}
}
#thanksScreen h2{
  font-family:'Orbitron',sans-serif;font-size:clamp(16px,3vw,28px);
  letter-spacing:.5em;padding-left:.5em;color:#fbbf24;margin-bottom:24px;
  text-shadow:0 0 20px #fbbf24,0 0 50px rgba(251,191,36,.6);
  animation:thanksText 2.5s ease forwards;
}
#thanksScreen .thanks-name{
  font-family:'Orbitron',sans-serif;font-size:clamp(32px,7vw,80px);font-weight:900;
  letter-spacing:.12em;padding-left:.12em;color:#fff;
  text-shadow:0 0 15px #0ff,0 0 40px #0ff,0 0 80px rgba(0,255,255,.5);
  animation:thanksName 2.5s ease forwards;
}
@keyframes thanksText{
  0%{opacity:0;transform:translateY(-20px)}
  30%{opacity:1;transform:translateY(0)}
  100%{opacity:1}
}
@keyframes thanksName{
  0%{opacity:0;transform:scale(.9)}
  25%{opacity:1;transform:scale(1)}
  100%{opacity:1;transform:scale(1.05)}
}

/* ===== 模式选择 ===== */
#modeSelectScreen{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:transparent;pointer-events:auto;
}
#modeSelectScreen h2{
  font-family:'Orbitron',sans-serif;font-size:clamp(28px,5vw,48px);
  letter-spacing:.2em;padding-left:.2em;color:#0ff;margin-bottom:46px;
  text-shadow:0 0 20px #0ff,0 0 45px rgba(0,255,255,.6);
  animation:modeTitlePulse 2.4s ease-in-out infinite alternate;
}
@keyframes modeTitlePulse{
  0%{text-shadow:0 0 15px #0ff,0 0 35px rgba(0,255,255,.5)}
  100%{text-shadow:0 0 25px #0ff,0 0 65px rgba(0,255,255,.9)}
}
.mode-buttons{
  display:flex;flex-direction:column;gap:18px;width:min(360px,86vw);
}
.mode-btn{
  padding:18px 28px;
  font-family:'Orbitron',sans-serif;font-size:19px;font-weight:900;letter-spacing:.12em;
  background:rgba(0,255,255,0.06);
  border:1px solid rgba(0,255,255,.55);
  color:#0ff;cursor:pointer;
  transition:all .22s;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  text-shadow:0 0 8px #0ff;
  box-shadow:inset 0 0 14px rgba(0,255,255,.08),0 0 18px rgba(0,255,255,.08);
  position:relative;overflow:hidden;
}
.mode-btn::before{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(0,255,255,.35),transparent);
  transition:left .4s;
}
.mode-btn:hover:not(:disabled)::before{left:100%}
.mode-btn:hover:not(:disabled){
  background:rgba(0,255,255,.16);
  box-shadow:0 0 35px rgba(0,255,255,.7),inset 0 0 24px rgba(0,255,255,.3);
  color:#fff;
}
.mode-btn:disabled{
  opacity:.38;cursor:not-allowed;
  border-color:rgba(255,255,255,.18);
  color:rgba(255,255,255,.35);
  text-shadow:none;
  box-shadow:none;
}
.mode-btn small{
  display:block;font-family:'Share Tech Mono',monospace;
  font-size:12px;letter-spacing:.2em;margin-top:6px;
  color:#fbbf24;text-shadow:0 0 6px #fbbf24;
}
.mode-btn:disabled small{color:rgba(255,255,255,.3);text-shadow:none}

/* ===== 菜单淡入 ===== */
#menu.fade-in{
  animation:menuFadeIn 1.2s ease forwards;
}
@keyframes menuFadeIn{
  from{opacity:0;transform:scale(.96)}
  to{opacity:1;transform:scale(1)}
}

/* ===== 原有样式 ===== */
#hud{position:fixed;top:0;left:0;right:0;padding:18px 24px;pointer-events:none;z-index:5;font-family:'Share Tech Mono', monospace;}
.hud-inner{width:340px;max-width:70vw}
.bar{height:9px;border-radius:0;overflow:hidden;background:rgba(0,255,255,.1);border:1px solid rgba(0,255,255,.3); clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);}
.bar i{display:block;height:100%;width:100%;transition:width .12s linear}
.hp i{background:linear-gradient(90deg,#f43f5e,#fb7185); box-shadow:0 0 10px #f43f5e;}
.exp{margin-top:8px;height:5px}
.exp i{background:linear-gradient(90deg,#0ff,#a78bfa); box-shadow:0 0 10px #0ff;}
#stats{margin-top:12px;color:rgba(0,255,255,.7);font-size:14px;letter-spacing:.1em; text-shadow:0 0 5px #0ff;}
#stats b{color:#fff;font-weight:600}
#stats .coin{color:#fbbf24; text-shadow:0 0 5px #fbbf24;}

#skillHud{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:5;font-family:'Share Tech Mono', monospace;}
#skillBar{width:200px;height:8px;background:rgba(0,255,255,.1);border:1px solid rgba(0,255,255,.3); overflow:hidden; clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);}
#skillFill{width:100%;height:100%;background:linear-gradient(90deg,#0ff,#f472b6); box-shadow:0 0 10px #0ff;}
#skillText{color:rgba(0,255,255,.8);font-size:13px;letter-spacing:.2em;text-align:center; text-shadow:0 0 5px #0ff;}

#bossHud{position:fixed;top:20px;left:50%;transform:translateX(-50%);width:600px;max-width:90vw;text-align:center;z-index:5;pointer-events:none;transition:opacity .3s; font-family:'Orbitron', sans-serif;}
.boss-name{font-size:22px;font-weight:900;letter-spacing:4px;margin-bottom:6px;text-shadow:0 0 15px currentColor}
.boss-bar{height:18px;background:rgba(0,0,0,.8);border-radius:0;overflow:hidden;border:1px solid rgba(255,255,255,.2);position:relative;box-shadow:0 0 20px currentColor; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);}
#bossFill{display:block;height:100%;width:100%;transition:width .1s}
.boss-text{position:absolute;top:0;left:0;width:100%;height:100%;color:#fff;font-size:12px;line-height:18px;text-align:center;text-shadow:1px 1px 3px #000;font-weight:bold; font-family:'Share Tech Mono';}
#bossShieldText{color:#fbbf24;font-size:14px;font-weight:bold;margin-top:4px;text-shadow:0 0 10px #fbbf24;letter-spacing:2px; font-family:'Share Tech Mono';}

.fullscreen-menu {
  position: absolute; inset: 0; z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: auto; background: transparent; cursor: default;
}
.fullscreen-menu h1 {
  font-family: 'Orbitron', sans-serif; font-size: 100px; font-weight: 900; letter-spacing: .1em;
  position: relative; text-transform: uppercase; margin-bottom: 10px;
  display: flex; gap: 10px;
}
.fullscreen-menu h1 span {
  display: inline-block;
  animation: colorCycle 3s infinite alternate;
}
.fullscreen-menu h1 span:nth-child(1) { animation-delay: 0.0s; }
.fullscreen-menu h1 span:nth-child(2) { animation-delay: 0.2s; }
.fullscreen-menu h1 span:nth-child(3) { animation-delay: 0.4s; }
.fullscreen-menu h1 span:nth-child(4) { animation-delay: 0.6s; }
.fullscreen-menu h1 span:nth-child(5) { animation-delay: 0.8s; }
.fullscreen-menu h1 span:nth-child(6) { animation-delay: 1.0s; }
.fullscreen-menu h1 span:nth-child(7) { animation-delay: 1.2s; }
.fullscreen-menu h1 span:nth-child(8) { animation-delay: 1.4s; }
@keyframes colorCycle {
  0% { color: #0ff; text-shadow: 0 0 10px #0ff, 0 0 20px #0ff; }
  50% { color: #a78bfa; text-shadow: 0 0 10px #a78bfa, 0 0 20px #a78bfa; }
  100% { color: #f43f5e; text-shadow: 0 0 10px #f43f5e, 0 0 20px #f43f5e; }
}
.fullscreen-menu .subtitle {
  color: rgba(0, 255, 255, 0.8); font-size: 22px; letter-spacing: 0.4em; margin-bottom: 60px; text-shadow: 0 0 10px #0ff;
}
.menu-buttons { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;}
.menu-coins { margin-top: 50px; font-size: 18px; color: #94a3b8; letter-spacing: 2px; }

#overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(0,0,0,0.85); backdrop-filter:blur(5px); transition: opacity 0.3s; cursor: default;}
.panel{pointer-events:auto;text-align:center;background:rgba(10,15,30,.95);border:1px solid rgba(0,255,255,.3);padding:40px 50px;box-shadow:0 0 50px rgba(0,255,255,.1), inset 0 0 30px rgba(0,255,255,.05);max-width:94vw; position:relative; animation: pop .3s cubic-bezier(.2,.9,.3,1.3); clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px); cursor: default;}
@keyframes pop { from { transform:scale(.95); opacity:0; } to { transform:scale(1); opacity:1; } }
.hidden{display:none!important}

.panel h1 {
  font-family: 'Orbitron', sans-serif; font-size: 42px; font-weight: 900; letter-spacing: .15em;
  color: #fff; text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff;
  position: relative; margin-bottom: 20px; text-transform: uppercase;
}
.panel h1::before, .panel h1::after {
  content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,15,30,.95);
}
.panel h1::before { left: 3px; text-shadow: -2px 0 #f0f; clip: rect(24px, 550px, 90px, 0); animation: glitch-anim 3s infinite linear alternate-reverse; }
.panel h1::after { left: -3px; text-shadow: -2px 0 #0ff; clip: rect(85px, 550px, 140px, 0); animation: glitch-anim2 2.5s infinite linear alternate-reverse; }
@keyframes glitch-anim {
  0% { clip: rect(10px, 9999px, 83px, 0); } 20% { clip: rect(62px, 9999px, 14px, 0); }
  40% { clip: rect(33px, 9999px, 55px, 0); } 60% { clip: rect(89px, 9999px, 98px, 0); }
  80% { clip: rect(44px, 9999px, 23px, 0); } 100% { clip: rect(12px, 9999px, 76px, 0); }
}
@keyframes glitch-anim2 {
  0% { clip: rect(65px, 9999px, 100px, 0); } 20% { clip: rect(12px, 9999px, 55px, 0); }
  40% { clip: rect(85px, 9999px, 20px, 0); } 60% { clip: rect(33px, 9999px, 90px, 0); }
  80% { clip: rect(77px, 9999px, 44px, 0); } 100% { clip: rect(22px, 9999px, 60px, 0); }
}

.panel h2{font-family:'Orbitron', sans-serif; font-size:24px;color:#0ff;letter-spacing:.2em;margin-bottom:22px; text-shadow:0 0 10px #0ff;}
.panel p{color:rgba(0,255,255,.6);font-size:15px;line-height:1.9; font-family:'Share Tech Mono';}
.panel p.k{color:#fff; text-shadow:0 0 5px #fff;}

button{
  padding:14px 40px;border:1px solid #0ff;
  background:rgba(0,255,255,0.1);color:#0ff;
  font-family:'Orbitron', sans-serif;font-weight:900;font-size:16px;letter-spacing:.15em;
  cursor:pointer;transition:all .2s;box-shadow:inset 0 0 10px rgba(0,255,255,0.2);
  clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
  text-shadow: 0 0 5px #0ff; position:relative; overflow:hidden;
}
button::before {
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(0,255,255,0.4),transparent);transition:left .4s;
}
button:hover::before { left:100%; }
button:hover{background:rgba(0,255,255,0.25);box-shadow:0 0 20px rgba(0,255,255,0.6), inset 0 0 20px rgba(0,255,255,0.4);color:#fff;}
button:disabled{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.2);border-color:rgba(255,255,255,0.1);cursor:not-allowed;box-shadow:none;text-shadow:none;}
button:disabled::before{display:none;}

.btn-buy { border-color:#fbbf24; background:rgba(251,191,36,0.1); color:#fbbf24; text-shadow:0 0 5px #fbbf24; box-shadow:inset 0 0 10px rgba(251,191,36,0.2);}
.btn-buy:hover { background:rgba(251,191,36,0.25); box-shadow:0 0 20px rgba(251,191,36,0.6); color:#fff;}
.btn-buy::before { background:linear-gradient(90deg,transparent,rgba(251,191,36,0.4),transparent); }

.btn-full { border-color:#a78bfa; background:rgba(167,139,250,0.1); color:#a78bfa; text-shadow:0 0 5px #a78bfa; box-shadow:inset 0 0 10px rgba(167,139,250,0.2);}
.btn-full:hover { background:rgba(167,139,250,0.25); box-shadow:0 0 20px rgba(167,139,250,0.6); color:#fff;}
.btn-full::before { background:linear-gradient(90deg,transparent,rgba(167,139,250,0.4),transparent); }

.btn-danger { border-color:#f43f5e; background:rgba(244,63,94,0.1); color:#f43f5e; text-shadow:0 0 5px #f43f5e; box-shadow:inset 0 0 10px rgba(244,63,94,0.2);}
.btn-danger:hover { background:rgba(244,63,94,0.25); box-shadow:0 0 20px rgba(244,63,94,0.6); color:#fff;}
.btn-danger::before { background:linear-gradient(90deg,transparent,rgba(244,63,94,0.4),transparent); }

.panel button { margin-top: 20px; }

input[type=range] {
  -webkit-appearance: none; width: 200px; background: transparent; margin: 10px 0;
}
input[type=range]::-webkit-slider-runnable-track {
  width: 100%; height: 8px; cursor: pointer; background: rgba(0, 255, 255, 0.2); border: 1px solid rgba(0, 255, 255, 0.5);
}
input[type=range]::-webkit-slider-thumb {
  height: 20px; width: 10px; background: #0ff; cursor: pointer; -webkit-appearance: none; margin-top: -7px; box-shadow: 0 0 10px #0ff;
}

.close-btn {
  position: absolute; top: 15px; right: 15px; width: 32px; height: 32px;
  padding: 0; border: none; background: transparent; color: #0ff;
  font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: none;
  clip-path: none; display: flex; align-items: center; justify-content: center;
}
.close-btn:hover { color: #f43f5e; background: transparent; box-shadow: none; }
.close-btn::before { display: none; }

.cyber-icon {
  font-family: 'Share Tech Mono', monospace;
  font-size: 32px;
  margin-bottom: 12px;
  color: var(--accent, #0ff);
  text-shadow: 0 0 10px var(--accent, #0ff), 0 0 22px var(--accent-soft, rgba(0,255,255,.4));
  font-weight: 900;
}

#cards, #bulletCards, #charCards {display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:20px; perspective: 1000px;}
.card{
  --accent:#0ff;
  --accent-soft:rgba(0,255,255,.35);
  --accent-bg:rgba(0,255,255,.12);
  width:180px;padding:24px 16px;cursor:pointer;
  background:rgba(255,255,255,0.035);border:1px solid var(--accent-soft);
  transition:all .2s;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  box-shadow:inset 0 0 15px rgba(255,255,255,0.03); position:relative;
  animation: cardIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
}
.card::after{
  content:'';position:absolute;top:0;left:10px;right:0;height:2px;
  background:linear-gradient(90deg, var(--accent), transparent);
  opacity:.85;pointer-events:none;
}
.card:nth-child(1) { animation-delay: 0.1s; }
.card:nth-child(2) { animation-delay: 0.2s; }
.card:nth-child(3) { animation-delay: 0.3s; }
@keyframes cardIn {
  0% { opacity: 0; transform: translateY(50px) scale(0.8) rotateX(-20deg); }
  100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0); }
}
.card:hover{
  transform:translateY(-8px) scale(1.05);
  border-color: var(--accent);
  box-shadow:0 0 35px var(--accent-soft), inset 0 0 20px var(--accent-soft);
  background: var(--accent-bg);
}
.card .name{color:#fff;font-family:'Orbitron', sans-serif;font-weight:700;font-size:16px;margin-bottom:8px;letter-spacing:.06em; text-shadow:0 0 7px var(--accent-soft);}
.card .desc{color:rgba(255,255,255,0.62);font-size:13px;line-height:1.6; font-family:'Share Tech Mono';}

#shop, #settings, #selectCharPanel, #selectBulletPanel { width: 750px; max-width: 95vw; max-height: 90vh; overflow-y: auto;}
.shop-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; text-align: left; }
.shop-item {
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(0,255,255,0.03); padding: 14px 18px;
  border: 1px solid rgba(0,255,255,0.15);
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
}
.shop-item .shop-icon{
  width: 46px; height: 46px; flex: 0 0 46px;
  display:flex;align-items:center;justify-content:center;
  font-size: 22px; font-weight: 900; color: var(--ic,#0ff);
  border: 1px solid var(--ic,#0ff);
  background: rgba(255,255,255,0.03);
  text-shadow: 0 0 10px var(--ic,#0ff);
  box-shadow: inset 0 0 12px rgba(255,255,255,0.04), 0 0 14px -6px var(--ic,#0ff);
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  margin-right: 16px;
}
.shop-item .info { flex: 1; min-width: 0; }
.shop-item .info h3 { color: #fff; font-size: 16px; margin-bottom: 4px; font-family:'Orbitron'; text-shadow:0 0 5px #0ff;}
.shop-item .info p { color: rgba(0,255,255,0.5); font-size: 13px; }
.shop-item button { margin: 0; padding: 8px 20px; font-size: 14px; }
.shop-item .equipped { color: #0ff; font-family:'Orbitron'; font-weight: bold; font-size: 14px; margin-right: 15px; text-shadow:0 0 5px #0ff;}

.ship-svg {
  width: 80px; height: 80px;
  filter: drop-shadow(0 0 10px currentColor);
  margin: 0 auto 15px auto;
  display:block;
}

select {
  background: rgba(0, 255, 255, 0.1);
  border: 1px solid #0ff;
  color: #0ff;
  padding: 8px 15px;
  font-family: 'Orbitron';
  font-size: 16px;
  outline: none;
  cursor: pointer;
  border-radius: 4px;
}
select option { background: #05060f; color: #0ff; }

#victoryChest{
  position:fixed;inset:0;z-index:35;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background:radial-gradient(circle at 50% 45%, rgba(251,191,36,.12), rgba(0,0,0,.93) 65%);
  cursor:pointer; animation:fadeIn .5s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.chest-scene{position:relative;width:300px;height:300px;display:flex;align-items:center;justify-content:center;}
.chest-rays{
  position:absolute;inset:-60px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg, rgba(251,191,36,.20) 0deg 6deg, transparent 6deg 18deg);
  animation:chestSpin 16s linear infinite;
  -webkit-mask:radial-gradient(circle, #000 0%, #000 40%, transparent 72%);
  mask:radial-gradient(circle, #000 0%, #000 40%, transparent 72%);
}
@keyframes chestSpin{to{transform:rotate(360deg)}}
.chest-glow{
  position:absolute;inset:10px;border-radius:50%;
  background:radial-gradient(circle, rgba(251,191,36,.35), rgba(251,191,36,0) 65%);
  animation:chestPulse 1.8s ease-in-out infinite;
}
@keyframes chestPulse{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1.15);opacity:1}}
.cyber-chest{
  position:relative;width:180px;height:150px;
  animation:chestFloat 2.6s ease-in-out infinite;
  filter:drop-shadow(0 0 22px rgba(251,191,36,.85));
}
@keyframes chestFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.chest-hint{
  font-family:'Orbitron',sans-serif;font-size:20px;letter-spacing:.25em;color:#fbbf24;
  text-shadow:0 0 12px #fbbf24,0 0 26px rgba(251,191,36,.5);
  animation:hintBlink 1.6s ease-in-out infinite;
}
@keyframes hintBlink{0%,100%{opacity:.55}50%{opacity:1}}
#chestBurst{
  position:fixed;inset:0;z-index:36;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 45%, #ffffff 0%, #fff3c4 18%, rgba(251,191,36,.55) 38%, rgba(251,191,36,0) 68%);
}
#chestBurst.go{animation:chestBurstAnim 1.05s ease-out forwards;}
@keyframes chestBurstAnim{
  0%{opacity:0;transform:scale(.12)}
  18%{opacity:1}
  100%{opacity:0;transform:scale(3.6)}
}

#bossDialog{
  position:fixed;bottom:120px;left:50%;transform:translateX(-50%);
  z-index:15;width:700px;max-width:88vw;padding:20px 30px 26px;
  background:rgba(5,6,15,0.94);
  border:1px solid rgba(255,255,255,0.3);
  clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
  box-shadow:0 0 40px rgba(0,255,255,.15);
  backdrop-filter:blur(4px);
  animation: dialogIn .3s ease;
  pointer-events:none;
  transition: border-color .25s, box-shadow .25s;
}
@keyframes dialogIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.boss-dialog-name{
  font-family:'Orbitron', sans-serif;
  font-weight:900;font-size:15px;letter-spacing:3px;margin-bottom:8px;
  text-shadow:0 0 10px currentColor;
}
.boss-dialog-text{
  font-family:'Share Tech Mono', monospace;
  font-size:17px;line-height:1.7;color:#e5e7eb;letter-spacing:1px;
  min-height: 1.7em;
}
.boss-dialog-hint{
  position:absolute; bottom:7px; right:18px;
  font-family:'Share Tech Mono', monospace;
  font-size:11px; color:rgba(255,255,255,.42); letter-spacing:3px;
  animation:hintBlink 1.2s ease-in-out infinite;
}

#bossDialog.theme-blood{
  border: 2px solid #ff6b35;
  box-shadow:
    0 0 25px rgba(255,100,0,.65),
    0 0 50px rgba(255,50,0,.4),
    inset 0 0 35px rgba(255,80,0,.18);
  animation: dialogIn .3s ease, bloodFireFlicker .16s ease-in-out infinite alternate;
}
@keyframes bloodFireFlicker{
  0%{ border-color:#ff6b35; box-shadow:0 0 25px rgba(255,100,0,.6), 0 0 50px rgba(255,50,0,.35), inset 0 0 30px rgba(255,80,0,.16); }
  100%{ border-color:#ffaa00; box-shadow:0 0 35px rgba(255,150,0,.85), 0 0 70px rgba(255,80,0,.55), inset 0 0 45px rgba(255,100,0,.28); }
}
#bossDialog.theme-blood::before{
  content:'';
  position:absolute; inset:-6px;
  pointer-events:none;
  background:
    radial-gradient(18px 30px at 8% 20%, rgba(255,140,0,.45), transparent 70%),
    radial-gradient(14px 26px at 22% 85%, rgba(255,90,0,.4), transparent 70%),
    radial-gradient(16px 28px at 48% 12%, rgba(255,170,0,.35), transparent 70%),
    radial-gradient(14px 24px at 72% 90%, rgba(255,110,0,.4), transparent 70%),
    radial-gradient(18px 30px at 92% 30%, rgba(255,150,0,.45), transparent 70%);
  animation: bloodFlames 1.2s ease-in-out infinite alternate;
  z-index:-1;
  filter:blur(3px);
}
@keyframes bloodFlames{
  0%{ transform:translateY(2px) scaleY(.9); opacity:.7; }
  50%{ opacity:1; }
  100%{ transform:translateY(-6px) scaleY(1.15); opacity:.85; }
}
#bossDialog.theme-blood .boss-dialog-name{
  color:#ffb38a;
  text-shadow:0 0 12px #ff6b35, 0 0 26px #ff4500, 0 0 45px rgba(255,60,0,.6);
}
#bossDialog.theme-blood .boss-dialog-text{
  color:#ffe4c4;
  text-shadow:
    0 0 6px #ff6b35,
    0 0 14px #ff4500,
    0 0 26px #ff3300,
    0 0 40px rgba(255,50,0,.55);
  animation: bloodTextBurn .55s ease-in-out infinite alternate;
}
@keyframes bloodTextBurn{
  0%{ text-shadow:0 0 6px #ff6b35, 0 0 14px #ff4500, 0 0 26px #ff3300, 0 0 40px rgba(255,50,0,.5); }
  100%{ text-shadow:0 0 10px #ffaa00, 0 0 20px #ff6b35, 0 0 34px #ff4500, 0 0 55px rgba(255,80,0,.7); }
}
#bossDialog.theme-blood .boss-dialog-hint{ color:rgba(255,180,120,.6); }

#bossDialog.theme-void{
  border: 1px solid rgba(168,85,247,.6);
  box-shadow:
    0 0 35px rgba(168,85,247,.45),
    0 0 70px rgba(120,40,220,.25),
    inset 0 0 30px rgba(168,85,247,.12);
  animation: dialogIn .3s ease, voidGlow 2.8s ease-in-out infinite;
}
@keyframes voidGlow{
  0%,100%{ box-shadow:0 0 30px rgba(168,85,247,.35), 0 0 60px rgba(120,40,220,.18), inset 0 0 25px rgba(168,85,247,.1); }
  50%{ box-shadow:0 0 55px rgba(192,132,252,.65), 0 0 100px rgba(140,60,230,.35), inset 0 0 45px rgba(168,85,247,.22); }
}
#bossDialog.theme-void::before{
  content:'';
  position:absolute; inset:0;
  pointer-events:none;
  background:
    radial-gradient(5px 5px at 8% 22%, rgba(233,213,255,.95), transparent),
    radial-gradient(4px 4px at 18% 78%, rgba(192,132,252,.9), transparent),
    radial-gradient(6px 6px at 32% 14%, rgba(168,85,247,.85), transparent),
    radial-gradient(4px 4px at 46% 86%, rgba(233,213,255,.8), transparent),
    radial-gradient(5px 5px at 62% 20%, rgba(192,132,252,.9), transparent),
    radial-gradient(4px 4px at 74% 72%, rgba(168,85,247,.85), transparent),
    radial-gradient(6px 6px at 88% 34%, rgba(233,213,255,.9), transparent),
    radial-gradient(4px 4px at 94% 82%, rgba(192,132,252,.85), transparent),
    radial-gradient(5px 5px at 54% 50%, rgba(168,85,247,.7), transparent);
  animation: voidSparkle 2.4s ease-in-out infinite alternate;
  z-index:1;
}
@keyframes voidSparkle{
  0%{ opacity:.35; transform:translateY(0) scale(.9); }
  100%{ opacity:1; transform:translateY(-4px) scale(1.1); }
}
#bossDialog.theme-void .boss-dialog-name{
  color:#d8b4fe;
  text-shadow:0 0 12px #a855f7, 0 0 26px rgba(168,85,247,.6);
}
#bossDialog.theme-void .boss-dialog-text{
  color:#ede9fe;
  text-shadow:0 0 8px rgba(192,132,252,.8), 0 0 18px rgba(168,85,247,.5);
}
#bossDialog.theme-void .boss-dialog-hint{ color:rgba(200,160,255,.55); }

#bossDialog.theme-overlord{
  border: 2px solid #fbbf24;
  box-shadow:
    0 0 40px rgba(251,191,36,.55),
    0 0 80px rgba(245,158,11,.3),
    inset 0 0 35px rgba(251,191,36,.18);
  animation: dialogIn .3s ease, overlordGoldPulse 2.2s ease-in-out infinite;
}
@keyframes overlordGoldPulse{
  0%,100%{ box-shadow:0 0 32px rgba(251,191,36,.45), 0 0 65px rgba(245,158,11,.22), inset 0 0 28px rgba(251,191,36,.14); }
  50%{ box-shadow:0 0 60px rgba(255,215,90,.85), 0 0 110px rgba(251,191,36,.45), inset 0 0 50px rgba(251,191,36,.3); }
}
#bossDialog.theme-overlord::after{
  content:'';
  position:absolute; inset:-2px;
  pointer-events:none;
  background:linear-gradient(115deg, transparent 35%, rgba(255,240,180,.35) 48%, rgba(255,255,220,.55) 50%, rgba(255,240,180,.35) 52%, transparent 65%);
  background-size:280% 100%;
  animation: goldSweep 2.6s linear infinite;
  z-index:0;
  mix-blend-mode:screen;
}
@keyframes goldSweep{
  0%{ background-position:180% 0; }
  100%{ background-position:-80% 0; }
}
#bossDialog.theme-overlord .boss-dialog-name{
  color:#fde68a;
  text-shadow:0 0 12px #fbbf24, 0 0 28px rgba(251,191,36,.7), 0 0 50px rgba(245,158,11,.5);
}
#bossDialog.theme-overlord .boss-dialog-text{
  background:linear-gradient(90deg, #fbbf24, #fef9c3, #fbbf24, #f59e0b, #fbbf24);
  background-size:220% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:#fbbf24;
  animation: goldTextShine 2s linear infinite;
  filter:drop-shadow(0 0 8px rgba(251,191,36,.85)) drop-shadow(0 0 16px rgba(245,158,11,.5));
  font-weight:bold;
}
@keyframes goldTextShine{
  0%{ background-position:0% 50%; }
  100%{ background-position:220% 50%; }
}
#bossDialog.theme-overlord .boss-dialog-hint{ color:rgba(255,215,120,.65); }

#bossDialog.theme-reaper{
  border: 2px solid #ff2d2d;
  box-shadow:0 0 45px rgba(255,45,45,.55), inset 0 0 35px rgba(255,45,45,.18);
  animation: dialogIn .3s ease, reaperPulse 1s ease-in-out infinite;
}
@keyframes reaperPulse{
  0%,100%{ border-color:#ff2d2d; box-shadow:0 0 32px rgba(255,45,45,.45), inset 0 0 25px rgba(255,45,45,.14); }
  50%{ border-color:#ff6b6b; box-shadow:0 0 70px rgba(255,45,45,.9), inset 0 0 50px rgba(255,45,45,.32); }
}
#bossDialog.theme-reaper .boss-dialog-name{
  color:#ff6b6b;
  text-shadow:0 0 14px #ff2d2d, 0 0 30px rgba(255,45,45,.7);
}
#bossDialog.theme-reaper .boss-dialog-text{
  color:#fecaca;
  text-shadow:0 0 8px #ff2d2d, 0 0 18px #ff0000, 0 0 35px rgba(150,0,0,.8);
  animation: reaperTextPulse .8s ease-in-out infinite alternate;
}
@keyframes reaperTextPulse{
  0%{ text-shadow:0 0 8px #ff2d2d, 0 0 18px #ff0000, 0 0 35px rgba(150,0,0,.7); }
  100%{ text-shadow:0 0 12px #ff6666, 0 0 26px #ff2d2d, 0 0 50px rgba(255,0,0,.85); }
}
#bossDialog.theme-reaper .boss-dialog-hint{ color:rgba(255,120,120,.6); }

.help-box{
  margin: 24px 0; text-align:left; border:1px solid rgba(0,255,255,.22);
  padding:16px 20px; background:rgba(0,255,255,.03);
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
}
.help-box .help-title{
  color:#0ff; font-family:'Orbitron', sans-serif; font-size:15px;
  letter-spacing:.15em; margin-bottom:10px; text-shadow:0 0 8px #0ff;
}
.help-box .help-body{
  color:rgba(255,255,255,.78); font-size:13.5px; line-height:2;
}
.help-box .help-body b{ color:#fbbf24; }
</style>

<body>
<canvas id="c"></canvas>

<!-- 开屏动画 -->
<div id="splashScreen">
  <h1>STARDUST HUNTER</h1>
  <p>CYBER FINALE</p>
</div>

<!-- 特别鸣谢 -->
<div id="thanksScreen" class="hidden">
  <h2>特别鸣谢</h2>
  <div class="thanks-name">蓝色大肥鱼</div>
</div>

<!-- 模式选择界面 -->
<div id="modeSelectScreen" class="hidden">
  <h2 data-i18n="mode_title">选择模式</h2>
  <div class="mode-buttons">
    <button class="mode-btn" data-mode="story" disabled>
      <span data-i18n="mode_story">剧情模式</span>
      <small data-i18n="mode_locked">暂未开放</small>
    </button>
    <button class="mode-btn" data-mode="fun" onclick="selectFunMode()">
      <span data-i18n="mode_fun">爽完模式</span>
    </button>
    <button class="mode-btn" data-mode="endless" disabled>
      <span data-i18n="mode_endless">无尽模式</span>
      <small data-i18n="mode_locked">暂未开放</small>
    </button>
    <button class="mode-btn" data-mode="settings" onclick="openSettings(false)">
      <span data-i18n="mode_settings">设置</span>
    </button>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="hud-inner">
    <div class="bar hp"><i id="hpFill"></i></div>
    <div class="bar exp"><i id="expFill"></i></div>
    <div id="stats"></div>
  </div>
</div>

<div id="bossHud" class="hidden">
  <div class="boss-name" id="bossName">BOSS</div>
  <div class="boss-bar" id="bossBar">
    <i id="bossFill"></i>
    <div class="boss-text" id="bossText">100%</div>
  </div>
  <div id="bossShieldText" class="hidden">[ 护盾存在中 / 无敌 ]</div>
</div>

<div id="skillHud" class="hidden">
  <div id="skillBar"><div id="skillFill"></div></div>
  <div id="skillText">空格 · 脉冲冲击波</div>
</div>

<div id="menu" class="fullscreen-menu hidden">
  <h1 id="mainTitle"></h1>
  <p class="subtitle" data-i18n="subtitle">赛博星域的生存挑战</p>
  
  <div class="menu-buttons">
    <button onclick="showSelectChar()" data-i18n="btn_start">开始连接</button>
    <button class="btn-buy" onclick="openShop()" data-i18n="btn_shop">星尘商城</button>
    <button class="btn-full" onclick="toggleFullscreen()" id="fullscreenBtn" data-i18n="btn_full">全屏模式</button>
    <button class="btn-full" onclick="openSettings(false)" style="border-color:#38bdf8; color:#38bdf8;" data-i18n="btn_settings">系统设置</button>
  </div>
  
  <div class="menu-coins"><span data-i18n="coins">可用星尘币:</span> <b style="color:#fbbf24;font-size:24px;" id="menuCoins">0</b></div>
</div>

<div id="overlay" class="hidden">
  
  <div id="selectCharPanel" class="panel hidden">
    <h2 data-text="选择战机" data-i18n="select_ship">选择战机</h2>
    <div id="charCards"></div>
    <button onclick="cancelSelect()" style="margin-top:30px;" data-i18n="btn_return">返回主菜单</button>
  </div>

  <div id="selectBulletPanel" class="panel hidden">
    <h2 data-text="选择弹幕" data-i18n="select_weapon">选择弹幕</h2>
    <div id="bulletCards"></div>
    <button onclick="showSelectChar()" style="margin-top:30px;" data-i18n="btn_back">返回上一步</button>
  </div>

  <div id="shop" class="panel hidden">
    <button class="close-btn" onclick="closeShop()">❌</button>
    <h1 data-text="商城" data-i18n="shop_title">星尘商城</h1>
    <p><span data-i18n="coins">可用星尘币:</span> <b style="color:#fbbf24;font-size:20px;" id="shopCoins">0</b></p>
    <div class="shop-list" id="shopList"></div>
    <button onclick="closeShop()" style="margin-top:30px;" data-i18n="btn_return">返回主菜单</button>
  </div>

  <div id="settings" class="panel hidden">
    <button class="close-btn" onclick="closeSettings()">❌</button>
    <h1 data-text="设置" data-i18n="settings_title">系统设置</h1>
    
    <div style="margin: 20px 0; font-size: 16px; color: #0ff; text-shadow: 0 0 5px #0ff;">
      <label style="display:block; margin-bottom:10px;" data-i18n="language">语言 / Language</label>
      <select id="langSelect" onchange="changeLanguage(this.value)">
        <option value="en">English</option>
        <option value="zh">中文</option>
      </select>
    </div>

    <div style="margin: 30px 0; font-size: 16px; color: #0ff; text-shadow: 0 0 5px #0ff;">
      <label><span data-i18n="volume">音效音量:</span> <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.3" oninput="changeVolume(this.value)"></label>
    </div>

    <div class="help-box">
      <div class="help-title" data-i18n="controls_title">玩法说明 / CONTROLS</div>
      <div class="help-body" id="controlsHelp"></div>
    </div>
    
    <button class="btn-danger" id="resetProgressBtn" onclick="resetGame()" data-i18n="btn_reset">初始化系统 (重置进度)</button>
    <button class="btn-full" onclick="switchToModeSelect()" style="margin-top:20px;" data-i18n="btn_switch_mode">切换模式</button>
    
    <button class="btn-danger" onclick="exitGame()" id="settingsExitBtn" style="display:none; margin-top:20px;" data-i18n="btn_quit">放弃并退出游戏</button>
    
    <div id="settingsMenuBtns">
      <button onclick="closeSettings()" style="margin-top:20px;" data-i18n="btn_return">返回主菜单</button>
    </div>
  </div>

  <div id="levelup" class="panel hidden">
    <h2 id="levelupTitle" data-text="系统升级" style="font-size:26px; letter-spacing:0.3em;">[ SYSTEM UPGRADE ]</h2>
    <div id="cards"></div>
  </div>

  <div id="gameover" class="panel hidden">
    <h1 id="gameoverTitle" data-text="航程终结">航程终结</h1>
    <p id="gameoverDesc" class="hidden" style="color:#fbbf24;font-size:18px;margin-bottom:10px;"></p>
    <div id="finalStats" style="margin-bottom:20px; font-size:16px; color:#cbd5e1;"></div>
    <button onclick="returnToMenu()" data-i18n="btn_disconnect">断开连接</button>
  </div>
</div>

<div id="bossDialog" class="hidden">
  <div class="boss-dialog-name" id="bossDialogName"></div>
  <div class="boss-dialog-text" id="bossDialogText"></div>
  <div class="boss-dialog-hint" id="bossDialogHint">点击继续 / CLICK</div>
</div>

<div id="victoryChest" class="hidden" onclick="openVictoryChest()">
  <div class="chest-scene">
    <div class="chest-rays"></div>
    <div class="chest-glow"></div>
    <svg class="cyber-chest" viewBox="0 0 220 190">
      <defs>
        <linearGradient id="chestBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#243049"/><stop offset="1" stop-color="#0a1120"/>
        </linearGradient>
        <linearGradient id="chestLid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3b4a66"/><stop offset="1" stop-color="#1b2436"/>
        </linearGradient>
      </defs>
      <path d="M28 82 L50 30 L170 30 L192 82 Z" fill="url(#chestLid)" stroke="#fbbf24" stroke-width="3.5" stroke-linejoin="round"/>
      <rect x="32" y="82" width="156" height="80" rx="8" fill="url(#chestBody)" stroke="#fbbf24" stroke-width="3.5"/>
      <line x1="46" y1="98" x2="174" y2="98" stroke="#22d3ee" stroke-width="2.5" opacity=".85"/>
      <line x1="46" y1="146" x2="174" y2="146" stroke="#22d3ee" stroke-width="2.5" opacity=".85"/>
      <rect x="92" y="96" width="36" height="42" rx="6" fill="#fbbf24"/>
      <circle cx="110" cy="114" r="7" fill="#0a1120"/>
      <rect x="107" y="114" width="6" height="16" rx="3" fill="#0a1120"/>
      <circle cx="50" cy="36" r="3" fill="#22d3ee"/>
      <circle cx="170" cy="36" r="3" fill="#22d3ee"/>
    </svg>
  </div>
  <div class="chest-hint" id="chestHint">点击开启胜利宝箱</div>
</div>
<div id="chestBurst"></div>

  currentLang = lang;
  const sel = document.getElementById("langSelect");
  if (sel) sel.value = lang;
  
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (I18N[lang][key]) {
      el.innerText = I18N[lang][key];
    }
  });

  document.querySelectorAll(".panel h1").forEach(el => {
    const text = el.innerText;
    el.setAttribute("data-text", text);
  });

  renderControlsHelp();

  if(!document.getElementById("shop").classList.contains("hidden")) renderShop();
  if(!document.getElementById("selectBulletPanel").classList.contains("hidden")) renderBulletSelection();
  if(!document.getElementById("selectCharPanel").classList.contains("hidden")) renderCharacterSelection();

  if(boss && boss.nameKey && !bossHud.classList.contains("hidden")){
    bossName.innerText = I18N[lang][boss.nameKey] || bossName.innerText;
  }
  const hintEl = document.getElementById("chestHint");
  if(hintEl) hintEl.innerText = I18N[lang].chest_hint;
}

function changeLanguage(lang) {
  updateLanguage(lang);
}

const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const d2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const fmt=s=>{const m=Math.floor(s/60),sec=Math.floor(s%60);return m+":"+String(sec).padStart(2,"0");};

function distToSegment(px, py, x1, y1, x2, y2) {
  const l2 = d2(x1, y1, x2, y2);
  if (l2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
}

function applyCardAccent(el, hex) {
  const raw = (hex || "#0ff").replace("#", "");
  const full = raw.length === 3 ? raw.split("").map(c => c + c).join("") : raw.padEnd(6, "f");
  const r = parseInt(full.substring(0, 2), 16) || 0;
  const g = parseInt(full.substring(2, 4), 16) || 0;
  const b = parseInt(full.substring(4, 6), 16) || 0;
  el.style.setProperty("--accent", "#" + full);
  el.style.setProperty("--accent-soft", `rgba(${r},${g},${b},0.38)`);
  el.style.setProperty("--accent-bg", `rgba(${r},${g},${b},0.14)`);
}

function openSettings(isInGame) {
  inGameSettings = isInGame;
  
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("modeSelectScreen").classList.add("hidden");
  document.getElementById("overlay").classList.remove("hidden");
  
  document.getElementById("shop").classList.add("hidden");
  document.getElementById("selectCharPanel").classList.add("hidden");
  document.getElementById("selectBulletPanel").classList.add("hidden");
  document.getElementById("levelup").classList.add("hidden");
  document.getElementById("gameover").classList.add("hidden");
  
  document.getElementById("settings").classList.remove("hidden");
  
  const exitBtn = document.getElementById("settingsExitBtn");
  const menuBtns = document.getElementById("settingsMenuBtns");
  const resetBtn = document.getElementById("resetProgressBtn");
  
  if (isInGame) {
    exitBtn.style.display = "inline-block";
    menuBtns.style.display = "none";
    resetBtn.style.display = "none";
    S.state = "paused";
    S.savedMouseX = mouse.x;
    S.savedMouseY = mouse.y;
    if (document.pointerLockElement) document.exitPointerLock();
  } else {
    exitBtn.style.display = "none";
    menuBtns.style.display = "block";
    resetBtn.style.display = "inline-block";
  }
}

function closeSettings() {
  document.getElementById("settings").classList.add("hidden");
  document.getElementById("overlay").classList.add("hidden");
  
  if (inGameSettings) {
    S.state = "playing";
    mouse.x = S.savedMouseX;
    mouse.y = S.savedMouseY;
    player.x = mouse.x;
    player.y = mouse.y;
    if (cvs.requestPointerLock) cvs.requestPointerLock();
  } else {
    if (S.state === "modeSelect") {
      document.getElementById("modeSelectScreen").classList.remove("hidden");
    } else {
      showMenuFadeIn();
    }
  }
}

  if (S.state === "playing" || S.state === "paused") {

    if (document.pointerLockElement) document.exitPointerLock();
    hudEl.classList.add("hidden");
    skillHudEl.classList.add("hidden");

  document.getElementById("levelup").classList.add("hidden");
  document.getElementById("gameover").classList.add("hidden");

  if (confirm(currentLang === "en" ? "Are you sure you want to reset? This clears all coins and unlocks." : "确定要初始化系统吗？这会清空所有的星尘币、武器解锁和成就记录，且无法恢复！")) {
    localStorage.clear();
    progress = {
      coins: 0,
      inventory: { straight: true, laser: false, radial: false, puppet: false, devourer: false },
      upgrades: { straight: false, laser: false, radial: false },
      equipped: "straight"

    document.getElementById("menuCoins").innerText = 0;
    document.getElementById("shopCoins").innerText = 0;
    alert(currentLang === "en" ? "System initialized." : "系统已初始化完成！");
    if (!inGameSettings) closeSettings();
  }
}

  try {
    const data = localStorage.getItem('stardust_progress_v2');
    if(data) {
      let parsed = JSON.parse(data);
      if(!parsed.inventory) parsed.inventory = {};
      if(!parsed.upgrades) parsed.upgrades = {};
      if(parsed.inventory.straight === undefined) parsed.inventory.straight = true;
      if(parsed.inventory.puppet === undefined) parsed.inventory.puppet = false;
      if(parsed.inventory.devourer === undefined) parsed.inventory.devourer = false;
      progress = parsed;
    }
    if(localStorage.getItem('stardust_reaper_defeated') === 'true') {
      progress.inventory.laser = true;
      progress.inventory.radial = true;
    }
  } catch(e){}
  document.getElementById("menuCoins").innerText = progress.coins;
  document.getElementById("shopCoins").innerText = progress.coins;
}

function renderShop() {
  const list = document.getElementById("shopList");
  list.innerHTML = "";
  
  SHOP_ITEMS.forEach(item => {
    let state = 'buy';
    let price = item.cost;
    let nameKey = item.nameKey;
    let descKey = item.descKey;

    if (item.type === 'weapon') {
      const owned = progress.inventory[item.id] === true;
      const upgraded = progress.upgrades[item.id] === true;
      if (owned && upgraded) {
        state = 'owned';
      } else if (owned) {
        state = 'upgrade';
        price = item.upgradeCost;
        nameKey = item.upNameKey;
        descKey = item.upDescKey;
      } else {
        state = 'buy';
        price = item.cost;
      }
    } else if (item.type === 'character') {
      state = progress.inventory[item.id] === true ? 'owned' : 'buy';
    } else {
      state = localStorage.getItem(`stardust_perk_${item.id}`) === 'true' ? 'owned' : 'buy';
    }
    
    let btnHtml = "";
    if (state === 'owned') {
      btnHtml = `<span class="equipped">${I18N[currentLang].btn_owned}</span>`;
    } else {
      const label = state === 'upgrade' ? I18N[currentLang].btn_upgrade : I18N[currentLang].btn_buy;
      const cls = progress.coins >= price ? "btn-buy" : "";
      btnHtml = `<button class="${cls}" onclick="buyItem('${item.id}', ${price}, '${item.type}', '${state}')" ${progress.coins < price ? 'disabled' : ''}>${label} (${price})</button>`;
    }
    
    const div = document.createElement("div");
    div.className = "shop-item";
    div.innerHTML = `
      <div class="shop-icon" style="--ic:${item.color}">${item.icon}</div>
      <div class="info">
        <h3>${I18N[currentLang][nameKey]}</h3>
        <p>${I18N[currentLang][descKey]}</p>
      </div>
      <div>${btnHtml}</div>
    `;
    list.appendChild(div);
  });
}

function buyItem(id, cost, type, state) {
  if (progress.coins < cost) return;
  progress.coins -= cost;
  
  if (type === 'weapon') {
    if (state === 'upgrade') progress.upgrades[id] = true;
    else progress.inventory[id] = true;
  } else if (type === 'character') {
    progress.inventory[id] = true;
  } else {
    localStorage.setItem(`stardust_perk_${id}`, 'true');
  }
  
  saveProgress();
  document.getElementById("shopCoins").innerText = progress.coins;
  document.getElementById("menuCoins").innerText = progress.coins;
  renderShop();
  initAudio(); beep(1000, 0.1, "sine", 0.05, 1500);
}

let actx=null;
let masterGain=null;
let bgmTimer=null;
let bgmStep=0;
let currentBgmType=0; 

function initAudio(){
  if(!actx){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC){
        actx=new AC();
        masterGain=actx.createGain();
        const volSlider = document.getElementById("volumeSlider");
        masterGain.gain.value = volSlider ? parseFloat(volSlider.value) : 0.3;
        masterGain.connect(actx.destination);
      }
    }catch(e){actx=null;}
  }
  if(actx&&actx.state==="suspended")actx.resume();
}

function changeVolume(val) {
  if (masterGain) {
    masterGain.gain.value = parseFloat(val);
  }
}

function beep(f,d,type,vol,to){
  if(!actx||actx.state!=="running")return;
  const t=actx.currentTime;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type||"square";o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(Math.max(1,to),t+d);
  g.gain.setValueAtTime(vol||.04,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(masterGain);
  o.start(t);o.stop(t+d+.02);
}

function playBGM(type) {
  stopBGM();
  if(!actx) return;
  currentBgmType = type;
  bgmStep = 0;
  
  const bpm = type===1?125 : type===2?140 : 160;
  const interval = 60000 / bpm / 4; 
  
  bgmTimer = setInterval(() => {
    if(!actx || actx.state !== "running" || currentBgmType !== type) return;
    const s = bgmStep;
    if (type === 1) {
      if (s % 8 === 0) beep(55, 0.2, "sawtooth", 0.08, 30);
      if (s % 8 === 4) beep(110, 0.1, "square", 0.05);
      if (s % 2 === 0) beep([110, 130.8, 146.8, 164.8][(s/2) % 4] * (s % 16 < 8 ? 1 : 1.5), 0.1, "sawtooth", 0.02);
    } else if (type === 2) {
      if (s % 16 === 0) beep(65.4, 0.3, "triangle", 0.08, 40); 
      if (s % 4 === 2) beep(220 * (s % 8 === 2 ? 1 : 1.5), 0.2, "sine", 0.03);
      if (s % 8 === 6) beep(440, 0.05, "square", 0.02);
    } else if (type === 3) {
      if (s % 4 === 0) beep(82.4, 0.1, "square", 0.1, 50); 
      if (s % 16 === 8) beep(164.8, 0.4, "sawtooth", 0.08);
      if (s % 2 === 0) beep([329.6, 392, 493.8, 587.3][s % 4], 0.08, "sawtooth", 0.02);
    }
    bgmStep++;
  }, interval);
}

function stopBGM() {
  if(bgmTimer) clearInterval(bgmTimer);
  bgmTimer = null;
  currentBgmType = 0;
}

// ===== 老旧齿轮绘制 =====
function drawRustyGear(cx, cy, r, teeth, angle) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  const inner = r * 0.75;
  const step = TAU / teeth;

  // 齿轮主体路径
  ctx.beginPath();
  for (let i = 0; i < teeth; i++) {
    const a0 = i * step;
    const a1 = a0 + step * 0.22;
    const a2 = a0 + step * 0.5;
    const a3 = a0 + step * 0.78;
    if (i === 0) ctx.moveTo(Math.cos(a0) * inner, Math.sin(a0) * inner);
    else ctx.lineTo(Math.cos(a0) * inner, Math.sin(a0) * inner);
    ctx.lineTo(Math.cos(a1) * (r * 0.97), Math.sin(a1) * (r * 0.97));
    ctx.lineTo(Math.cos(a2) * r, Math.sin(a2) * r);
    ctx.lineTo(Math.cos(a3) * (r * 0.97), Math.sin(a3) * (r * 0.97));
  }
  ctx.closePath();

  // 铜锈渐变填充
  const grad = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r);
  grad.addColorStop(0, "#3a2a18");
  grad.addColorStop(0.5, "#2a1f12");
  grad.addColorStop(1, "#1a120a");
  ctx.fillStyle = grad;
  ctx.fill();

  // 在齿轮内部绘制锈斑与磨损（裁剪）
  ctx.save();
  ctx.clip();

  // 表面同心圆加工痕迹
  ctx.strokeStyle = "rgba(150,100,60,0.1)";
  ctx.lineWidth = 1;
  for (let i = 1; i <= 3; i++) {
    ctx.beginPath();
    ctx.arc(0, 0, r * (0.3 + i * 0.15), 0, TAU);
    ctx.stroke();
  }

  // 锈斑
  for (let i = 0; i < 24; i++) {
    const a = (i * 2.399963) % TAU;
    const rr = r * (0.15 + ((i * 0.618033) % 0.8));
    const px = Math.cos(a) * rr;
    const py = Math.sin(a) * rr;
    const rustSize = r * (0.04 + (i % 5) * 0.012);
    const rustGrad = ctx.createRadialGradient(px, py, 0, px, py, rustSize);
    rustGrad.addColorStop(0, "rgba(190,90,35,0.55)");
    rustGrad.addColorStop(0.6, "rgba(140,60,20,0.35)");
    rustGrad.addColorStop(1, "rgba(100,40,10,0)");
    ctx.fillStyle = rustGrad;
    ctx.beginPath();
    ctx.arc(px, py, rustSize, 0, TAU);
    ctx.fill();
  }

  // 深色磨损点
  for (let i = 0; i < 14; i++) {
    const a = (i * 3.7) % TAU;
    const rr = r * (0.3 + ((i * 0.211) % 0.6));
    const px = Math.cos(a) * rr;
    const py = Math.sin(a) * rr;
    ctx.fillStyle = "rgba(15,8,4,0.3)";
    ctx.beginPath();
    ctx.arc(px, py, r * 0.05, 0, TAU);
    ctx.fill();
  }

  // 划痕
  ctx.strokeStyle = "rgba(200,150,100,0.12)";
  ctx.lineWidth = 1;
  for (let i = 0; i < 8; i++) {
    const a = (i * 1.7) % TAU;
    const len = r * (0.3 + (i % 3) * 0.15);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.3, Math.sin(a) * r * 0.3);
    ctx.lineTo(Math.cos(a + 0.3) * (r * 0.3 + len), Math.sin(a + 0.3) * (r * 0.3 + len));
    ctx.stroke();
  }

  ctx.restore();

  // 描边
  ctx.strokeStyle = "#5a3a20";
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.strokeStyle = "rgba(200,120,60,0.3)";
  ctx.lineWidth = 1;
  ctx.stroke();

  // 中心辐条
  const spokeCount = 6;
  ctx.strokeStyle = "rgba(50,30,18,0.8)";
  ctx.lineWidth = r * 0.08;
  for (let i = 0; i < spokeCount; i++) {
    const a = (i / spokeCount) * TAU;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.25, Math.sin(a) * r * 0.25);
    ctx.lineTo(Math.cos(a) * r * 0.7, Math.sin(a) * r * 0.7);
    ctx.stroke();
  }

  // 辐条高光
  ctx.strokeStyle = "rgba(160,110,65,0.4)";
  ctx.lineWidth = r * 0.03;
  for (let i = 0; i < spokeCount; i++) {
    const a = (i / spokeCount) * TAU;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - 0.05) * r * 0.3, Math.sin(a - 0.05) * r * 0.3);
    ctx.lineTo(Math.cos(a - 0.05) * r * 0.68, Math.sin(a - 0.05) * r * 0.68);
    ctx.stroke();
  }

  // 中心孔
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.25, 0, TAU);
  ctx.fillStyle = "#0a0704";
  ctx.fill();
  ctx.strokeStyle = "#4a3020";
  ctx.lineWidth = 2;
  ctx.stroke();

  // 中心轴
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.1, 0, TAU);
  ctx.fillStyle = "#2a1a10";
  ctx.fill();
  ctx.strokeStyle = "rgba(180,120,70,0.5)";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.restore();
}

function drawGearBackground() {
  ctx.fillStyle = "#0a0805";
  ctx.fillRect(0, 0, W, H);

  // 背景暗格纹理
  ctx.strokeStyle = "rgba(80,50,25,0.06)";
  ctx.lineWidth = 1;
  const gridSize = 80;
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  const cx = W / 2, cy = H / 2;
  const minDim = Math.min(W, H);

  // 多个老旧齿轮
  drawRustyGear(cx - W * 0.28, cy - H * 0.22, minDim * 0.34, 20, gearAngle * 0.6);
  drawRustyGear(cx + W * 0.28, cy + H * 0.22, minDim * 0.29, 16, -gearAngle * 0.8);
  drawRustyGear(cx + W * 0.1, cy - H * 0.34, minDim * 0.2, 12, gearAngle * 1.2);
  drawRustyGear(cx - W * 0.33, cy + H * 0.3, minDim * 0.15, 10, -gearAngle * 1.5);

  // 中心暖光
  ctx.globalCompositeOperation = "lighter";
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, minDim * 0.45);
  glow.addColorStop(0, "rgba(255,160,80,0.06)");
  glow.addColorStop(1, "rgba(255,160,80,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "source-over";

  // 暗角
  const vignette = ctx.createRadialGradient(cx, cy, minDim * 0.3, cx, cy, minDim * 0.8);
  vignette.addColorStop(0, "rgba(0,0,0,0)");
  vignette.addColorStop(1, "rgba(0,0,0,0.7)");
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
}
