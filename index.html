function drawCrosshair() {
  if (S.state === "menu" || S.state === "levelup" || S.state === "dead" || S.state === "paused" || S.state === "victory" || S.state === "victory_open" || S.state === "modeSelect" || S.state === "splash" || S.state === "thanks") return;
  ctx.save();
  ctx.translate(mouse.x, mouse.y);
  ctx.strokeStyle = "rgba(0, 255, 255, 0.8)";
  ctx.lineWidth = 2;
  ctx.shadowColor = "#0ff"; ctx.shadowBlur = 10;
  const len = 10, off = 5;
  ctx.beginPath();
  ctx.moveTo(-off-len, 0); ctx.lineTo(-off, 0);
  ctx.moveTo(off+len, 0); ctx.lineTo(off, 0);
  ctx.moveTo(0, -off-len); ctx.lineTo(0, -off);
  ctx.moveTo(0, off+len); ctx.lineTo(0, off);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, 2, 0, TAU);
  ctx.fillStyle = "#fff"; ctx.fill();
  ctx.restore();
}

function polyPath(x,y,r,sides,rot){
  ctx.beginPath();
  for(let i=0;i<sides;i++){ const a=rot+(i/sides)*TAU; const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r; if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py); }
  ctx.closePath();
}

function drawEnemies(){
  for(const e of enemies){
    if(e.dead)continue;
    ctx.globalCompositeOperation="lighter";ctx.globalAlpha=.14;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r*2.2,0,TAU);ctx.fillStyle=e.color;ctx.fill();
    ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
    ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.rot);
    if(e.sides>=8){ctx.beginPath();ctx.arc(0,0,e.r,0,TAU);} else polyPath(0,0,e.r,e.sides,0);
    ctx.fillStyle=e.flash>0?"#ffffff":e.color;ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.62)";ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,e.r*.36,0,TAU); ctx.fillStyle="rgba(255,255,255,.85)";ctx.fill();
    ctx.restore();
    if(e.hp<e.maxHp){
      const bw=e.r*2,p=clamp(e.hp/e.maxHp,0,1);
      ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(e.x-bw/2,e.y-e.r-9,bw,3);
      ctx.fillStyle="#fb7185";ctx.fillRect(e.x-bw/2,e.y-e.r-9,bw*p,3);
    }
  }
}

function drawBoss(){
  if(!boss || boss.dead) return;

  if (boss.state === "splitting") {
    const p = 1 - boss.timer / 1.2;
    const cx = boss.x, cy = boss.y;
    const r = boss.r;
    const shakeX = rand(-3, 3) * (1 - p);
    const shakeY = rand(-3, 3) * (1 - p);

    ctx.save();
    ctx.translate(cx + shakeX, cy + shakeY);

    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = `rgba(255,120,120,${0.7 + Math.sin(S.time*30)*0.3})`;
    ctx.lineWidth = 2 + p * 3;
    ctx.shadowColor = "#f43f5e";
    ctx.shadowBlur = 15;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU + 0.3;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      for (let s = 1; s <= 4; s++) {
        const rr = r * (s / 4) * (0.3 + p * 0.7);
        const px = Math.cos(a) * rr + rand(-4, 4) * (1 - p) * (s > 1 ? 1 : 0);
        const py = Math.sin(a) * rr + rand(-4, 4) * (1 - p) * (s > 1 ? 1 : 0);
        ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = "source-over";

    ctx.globalAlpha = Math.max(0, 1 - p * 1.3);
    polyPath(0, 0, r, 8, 0);
    ctx.fillStyle = boss.color;
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.7)";
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.globalAlpha = 1;

    if (p > 0.35) {
      const fragP = (p - 0.35) / 0.65;
      const dirs = [0, Math.PI/2, Math.PI, Math.PI*1.5];
      const colors = ["#f43f5e", "#fb7185", "#be123c", "#e11d48"];
      for (let i = 0; i < 4; i++) {
        const a = dirs[i];
        const dist = fragP * 70;
        const fx = Math.cos(a) * dist;
        const fy = Math.sin(a) * dist;

        ctx.save();
        ctx.translate(fx, fy);
        ctx.rotate(a + fragP * 2.5);

        ctx.beginPath();
        const sides = 5;
        for (let s = 0; s < sides; s++) {
          const sa = (s / sides) * TAU + (i * 0.6);
          const sr = r * 0.55 * (1 - fragP * 0.25);
          const px = Math.cos(sa) * sr;
          const py = Math.sin(sa) * sr;
          if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = colors[i];
        ctx.globalAlpha = Math.max(0.15, 1 - fragP * 0.35);
        ctx.fill();
        ctx.strokeStyle = "rgba(255,200,200,0.6)";
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.restore();
      }
    }

    ctx.restore();
    return;
  }

  if (boss.state === "dying") {
    if (boss.type === 3) {
      ctx.save(); ctx.translate(boss.x, boss.y); ctx.rotate(S.time * 20);
      const scale = 1 + (1.4 - boss.timer) * 1.2; ctx.globalAlpha = Math.max(0, boss.timer / 1.4);
      ctx.globalCompositeOperation="lighter"; ctx.beginPath(); ctx.arc(0,0,boss.r * scale * 2.2, 0, TAU); ctx.fillStyle = "#ffffff"; ctx.fill();
      ctx.globalCompositeOperation="source-over"; ctx.restore(); return;
    }
  }

  if (boss.type === 2 && boss.clones) {
    for (let c of boss.clones) {
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(S.time * 2);
      ctx.globalAlpha = boss.state === "attack" || boss.state === "warning" ? 0.6 : 0.2;
      ctx.globalCompositeOperation="lighter"; ctx.beginPath();ctx.arc(0,0,boss.r*1.5,0,TAU); ctx.fillStyle="rgba(168,85,247,0.4)";ctx.fill();
      ctx.globalCompositeOperation="source-over"; polyPath(0,0,boss.r,8,0); ctx.fillStyle="#a855f7"; ctx.fill(); ctx.strokeStyle="#e9d5ff";ctx.lineWidth=2;ctx.stroke();
      ctx.restore();
    }
  }

  if (boss.type === 2 && boss.state === "invisible") {
    ctx.globalCompositeOperation="lighter"; ctx.beginPath();ctx.arc(boss.x, boss.y, boss.r*1.5, 0, TAU); ctx.fillStyle="rgba(168,85,247,0.1)";ctx.fill();
    ctx.globalCompositeOperation="source-over"; return;
  }

  if (boss.state === "phase3_transition") {
    ctx.save(); ctx.translate(boss.x, boss.y);
    const p = 1 - boss.timer / 2.0;
    ctx.globalAlpha = 0.5 + Math.sin(S.time * 30) * 0.5;
    ctx.globalCompositeOperation = "lighter";
    ctx.beginPath(); ctx.arc(0, 0, boss.r * (1 + p * 3), 0, TAU);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.restore();
    return;
  }

  ctx.save(); ctx.translate(boss.x, boss.y);
  if (boss.state === "transition") { ctx.rotate(S.time * 10); ctx.scale(1 + Math.sin(S.time*20)*0.2, 1 + Math.sin(S.time*20)*0.2); } 
  else if (boss.state === "lastwords") { ctx.rotate(S.time * 0.8); }
  else { ctx.rotate(S.time * 0.5); }

  const isGrey = boss.state === "lastwords" || (boss.invulnerable && boss.state !== "intro");

  if (boss.type === 1) {
    const r = boss.r;

    ctx.globalCompositeOperation = "lighter";
    const glowG = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 2.0);
    glowG.addColorStop(0, "rgba(244,63,94,0.45)");
    glowG.addColorStop(1, "rgba(244,63,94,0)");
    ctx.beginPath(); ctx.arc(0, 0, r * 2.0, 0, TAU);
    ctx.fillStyle = glowG; ctx.fill();
    ctx.globalCompositeOperation = "source-over";

    ctx.beginPath();
    const sides = 10;
    for (let i = 0; i < sides; i++) {
      const a = (i / sides) * TAU - Math.PI / 2;
      const variation = 0.82 + Math.sin(i * 2.7 + S.time * 2) * 0.15;
      const rr = r * variation;
      const px = Math.cos(a) * rr;
      const py = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = isGrey ? "#666" : "#5a0a0a";
    ctx.strokeStyle = isGrey ? "#bbb" : "#ff2d2d";
    ctx.lineWidth = 3;
    ctx.shadowColor = "#f43f5e";
    ctx.shadowBlur = 30;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.stroke();

    ctx.strokeStyle = "rgba(255,80,80,0.7)";
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 4; i++) {
      const a = i * TAU / 4 + S.time * 0.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5, Math.cos(a) * r * 0.85, Math.sin(a) * r * 0.85);
      ctx.stroke();
    }

    ctx.fillStyle = isGrey ? "#999" : "#ff2d2d";
    for (let i = -2; i <= 2; i++) {
      const a = -Math.PI / 2 + i * 0.35;
      const baseX = Math.cos(a) * r * 0.72;
      const baseY = Math.sin(a) * r * 0.72;
      const tipX = Math.cos(a) * r * 1.38;
      const tipY = Math.sin(a) * r * 1.38;
      ctx.beginPath();
      ctx.moveTo(baseX - 6, baseY);
      ctx.lineTo(tipX, tipY);
      ctx.lineTo(baseX + 6, baseY);
      ctx.closePath();
      ctx.fill();
    }

    ctx.fillStyle = "#ff0000";
    ctx.beginPath(); ctx.ellipse(-r * 0.26, -r * 0.14, r * 0.18, r * 0.13, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.26, -r * 0.14, r * 0.18, r * 0.13, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ffdddd";
    ctx.beginPath(); ctx.ellipse(-r * 0.26, -r * 0.14, r * 0.06, r * 0.13, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.26, -r * 0.14, r * 0.06, r * 0.13, 0, 0, TAU); ctx.fill();

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-r * 0.3, r * 0.22);
    ctx.quadraticCurveTo(0, r * 0.45, r * 0.3, r * 0.22);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    for (let i = -1; i <= 1; i++) {
      const tx = i * r * 0.16;
      ctx.beginPath();
      ctx.moveTo(tx - 3, r * 0.29);
      ctx.lineTo(tx, r * 0.42);
      ctx.lineTo(tx + 3, r * 0.29);
      ctx.closePath();
      ctx.fill();
    }
  }
  else if (boss.type === 2) {
    const r = boss.r;

    ctx.globalCompositeOperation = "lighter";
    const glowG = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 2.2);
    glowG.addColorStop(0, "rgba(168,85,247,0.5)");
    glowG.addColorStop(1, "rgba(168,85,247,0)");
    ctx.beginPath(); ctx.arc(0, 0, r * 2.2, 0, TAU);
    ctx.fillStyle = glowG; ctx.fill();
    ctx.globalCompositeOperation = "source-over";

    ctx.beginPath();
    const n = 6;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU - Math.PI / 2;
      const rr = r * (i % 2 === 0 ? 1 : 0.75);
      const px = Math.cos(a) * rr;
      const py = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = isGrey ? "#666" : "#2e1065";
    ctx.strokeStyle = isGrey ? "#bbb" : "#a855f7";
    ctx.lineWidth = 2.5;
    ctx.shadowColor = "#a855f7";
    ctx.shadowBlur = 30;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.stroke();

    ctx.strokeStyle = "rgba(192,132,252,0.7)";
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const a = S.time * 1.5 + i * TAU / 3;
      ctx.beginPath();
      ctx.arc(0, 0, r * (0.4 + i * 0.14), a, a + Math.PI * 0.95);
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.38, r * 0.22, S.time * 0.5, 0, TAU);
    ctx.fillStyle = "#e9d5ff";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.13, 0, TAU);
    ctx.fillStyle = "#1e1b4b";
    ctx.fill();

    const eyeAngles = [0.8, 2.4, 4.0, 5.2];
    for (let i = 0; i < eyeAngles.length; i++) {
      const a = eyeAngles[i] + S.time * 0.2;
      const ex = Math.cos(a) * r * 0.62;
      const ey = Math.sin(a) * r * 0.62;
      ctx.beginPath();
      ctx.arc(ex, ey, r * 0.08, 0, TAU);
      ctx.fillStyle = "#c084fc";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex, ey, r * 0.035, 0, TAU);
      ctx.fillStyle = "#000";
      ctx.fill();
    }
  }
  else if (boss.type === 3) {
    const r = boss.r;

    ctx.globalCompositeOperation = "lighter";
    const glowG = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 2.3);
    glowG.addColorStop(0, "rgba(251,191,36,0.55)");
    glowG.addColorStop(1, "rgba(251,191,36,0)");
    ctx.beginPath(); ctx.arc(0, 0, r * 2.3, 0, TAU);
    ctx.fillStyle = glowG; ctx.fill();
    ctx.globalCompositeOperation = "source-over";

    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU - Math.PI / 2;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = isGrey ? "#666" : "#78350f";
    ctx.strokeStyle = isGrey ? "#bbb" : "#fbbf24";
    ctx.lineWidth = 3;
    ctx.shadowColor = "#fbbf24";
    ctx.shadowBlur = 35;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.stroke();

    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU - Math.PI / 2 - S.time * 0.3;
      const rr = r * (i % 2 === 0 ? 0.62 : 0.3);
      const px = Math.cos(a) * rr;
      const py = Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = "#fde68a";
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const corePulse = 1 + Math.sin(S.time * 4) * 0.15;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.18 * corePulse, 0, TAU);
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "#fbbf24";
    ctx.shadowBlur = 22;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#fbbf24";
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.5;
    for (let i = -2; i <= 2; i++) {
      const baseX = i * r * 0.3;
      const baseY = -r * 0.7;
      const tipX = i * r * 0.36;
      const tipY = -r * 1.35 + Math.abs(i) * r * 0.18;
      ctx.beginPath();
      ctx.moveTo(baseX - 8, baseY);
      ctx.lineTo(tipX, tipY);
      ctx.lineTo(baseX + 8, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }

  ctx.restore();

  if (boss.minions) {
    for (let m of boss.minions) {
      if (m.dead) continue;
      
      let spawnScale = 1;
      if (m.spawnAnim > 0) spawnScale = 1 - m.spawnAnim; 

      if (m.type === 2 && m.clones) {
        for (let c of m.clones) {
          ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(S.time * 2); ctx.globalAlpha = m.state === "attack" || m.state === "warning" ? 0.6 : 0.2;
          ctx.globalCompositeOperation="lighter"; ctx.beginPath();ctx.arc(0,0,m.r*1.2,0,TAU); ctx.fillStyle="rgba(136,136,136,0.4)";ctx.fill();
          ctx.globalCompositeOperation="source-over"; polyPath(0,0,m.r*0.8,8,0); ctx.fillStyle="#888"; ctx.fill(); ctx.restore();
        }
      }
      if (m.type === 2 && m.state === "invisible") {
        ctx.globalCompositeOperation="lighter"; ctx.beginPath();ctx.arc(m.x, m.y, m.r*1.2, 0, TAU); ctx.fillStyle="rgba(136,136,136,0.1)";ctx.fill();
        ctx.globalCompositeOperation="source-over"; continue;
      }
      
      ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(S.time * 2); ctx.scale(spawnScale, spawnScale);
      ctx.globalCompositeOperation="lighter"; ctx.beginPath();ctx.arc(0,0,m.r*2,0,TAU); ctx.fillStyle="rgba(136,136,136,0.3)";ctx.fill();
      ctx.globalCompositeOperation="source-over"; polyPath(0,0,m.r,8,0); ctx.fillStyle="#888"; ctx.strokeStyle="#ccc"; ctx.lineWidth=3; ctx.fill();ctx.stroke();
      ctx.restore();
      
      const bw = m.r * 2; ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(m.x - bw/2, m.y - m.r - 15, bw, 5);
      ctx.fillStyle = "#ccc"; ctx.fillRect(m.x - bw/2, m.y - m.r - 15, bw * (m.hp/m.maxHp), 5);
    }
  }

  for(let p of pillars) {
    if(p.dead) continue;
    ctx.save(); ctx.translate(p.x, p.y);
    ctx.globalCompositeOperation="lighter"; ctx.beginPath();ctx.arc(0,0,p.r*2,0,TAU); ctx.fillStyle="rgba(251,191,36,0.2)";ctx.fill();
    ctx.globalCompositeOperation="source-over"; polyPath(0,0,p.r,4, S.time); ctx.fillStyle="#d97706"; ctx.strokeStyle="#fbbf24"; ctx.lineWidth=3; ctx.fill();ctx.stroke();
    if(p.hp < p.maxHp) { const bw = p.r*2; ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(-bw/2, -p.r - 12, bw, 4); ctx.fillStyle="#fbbf24"; ctx.fillRect(-bw/2, -p.r - 12, bw * (p.hp/p.maxHp), 4); }
    ctx.restore();
  }
}

function drawReaper() {
  if(!grimReaper) return;
  const dying = grimReaper.state === "dying";
  ctx.save(); ctx.translate(grimReaper.x, grimReaper.y);
  ctx.globalCompositeOperation="lighter"; 
  const pulse = 1 + Math.sin(S.time * 8) * 0.1;
  const alpha = dying ? Math.max(0.2, grimReaper.dyingTimer / 2.2) : 1;
  ctx.globalAlpha = alpha;
  ctx.beginPath();ctx.arc(0,0,grimReaper.r*2.5*pulse,0,TAU); ctx.fillStyle="rgba(0,0,0,0.8)";ctx.fill();
  ctx.beginPath();ctx.arc(0,0,grimReaper.r*1.8*pulse,0,TAU); ctx.strokeStyle="rgba(255,45,45,0.6)";ctx.lineWidth=6;ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,grimReaper.r,0,TAU); ctx.fillStyle="#000000";ctx.fill();
  ctx.fillStyle="#ff2d2d"; ctx.beginPath();ctx.arc(-15, -10, 6, 0, TAU);ctx.fill(); ctx.beginPath();ctx.arc(15, -10, 6, 0, TAU);ctx.fill();
  if (dying) {
    const s = 1 + (2.2 - grimReaper.dyingTimer) * 0.8;
    ctx.globalAlpha = alpha * 0.5;
    ctx.beginPath(); ctx.arc(0, 0, grimReaper.r * s, 0, TAU);
    ctx.fillStyle = "#ff2d2d"; ctx.fill();
  }
  ctx.restore(); 
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation="source-over";
}

function drawBullets(){
  ctx.globalCompositeOperation="lighter";
  for(const b of bullets){
    if (b.isRadial) {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r*1.8, 0, TAU); ctx.fillStyle = "rgba(252, 211, 77, 0.15)"; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fillStyle = "rgba(252, 211, 77, 0.6)"; ctx.fill();
    } else {
      ctx.beginPath();ctx.arc(b.x,b.y,b.r*2.6,0,TAU); ctx.fillStyle="rgba(125,211,252,.28)";ctx.fill();
      ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fillStyle=b.color || "#e0f2fe";ctx.fill();
    }
  }
  ctx.globalCompositeOperation="source-over";
}

function drawEBullets(){
  ctx.globalCompositeOperation="lighter";
  for(const b of ebullets){
    let c = "#f43f5e"; if(b.type === 3) c = "#fbbf24";
    ctx.beginPath();ctx.arc(b.x,b.y,b.r*2,0,TAU); ctx.fillStyle=c; ctx.globalAlpha=0.3; ctx.fill(); ctx.globalAlpha=1;
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fillStyle=c;ctx.fill();
  }
  ctx.globalCompositeOperation="source-over";
}

function drawLasers(){
  ctx.globalCompositeOperation="lighter";
  for(const L of lasers){
    const a = L.life / L.max; const w = L.width || 20; 
    ctx.beginPath(); ctx.moveTo(L.x1, L.y1);ctx.lineTo(L.x2, L.y2); ctx.strokeStyle = L.color; ctx.globalAlpha = a * 0.7;
    ctx.lineWidth = (w + 10) * a; ctx.lineCap = "round";ctx.stroke();
    ctx.beginPath(); ctx.moveTo(L.x1, L.y1);ctx.lineTo(L.x2, L.y2); ctx.strokeStyle = "#ffffff"; ctx.globalAlpha = a;
    ctx.lineWidth = (w / 2) * a;ctx.stroke();
  }
  ctx.globalAlpha = 1;ctx.globalCompositeOperation="source-over";
}

function drawOrbs(){
  ctx.globalCompositeOperation="lighter";
  for(const o of orbs){
    ctx.beginPath();ctx.arc(o.x,o.y,o.r*3.2,0,TAU); ctx.fillStyle=o.color || "#38bdf8";ctx.globalAlpha=0.2;ctx.fill(); ctx.globalAlpha=1;
    ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);
    ctx.beginPath(); for(let i=0;i<4;i++){ const a=(i/4)*TAU,r=i%2===0?o.r:o.r*.45; const px=Math.cos(a)*r,py=Math.sin(a)*r; if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py); }
    ctx.closePath();ctx.fillStyle=o.color || "#7dd3fc";ctx.fill(); ctx.restore();
  }
  ctx.globalCompositeOperation="source-over";
}

function drawCoinsDrop(){
  ctx.globalCompositeOperation="lighter";
  for(const c of coinsDrop){
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.beginPath(); ctx.arc(0,0,8,0,TAU); ctx.fillStyle="rgba(251,191,36,0.4)"; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,5,0,TAU); ctx.fillStyle="#fbbf24"; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,2,0,TAU); ctx.fillStyle="#fff"; ctx.fill();
    ctx.restore();
  }
  ctx.globalCompositeOperation="source-over";
}

function drawParticles(){
  ctx.globalCompositeOperation="lighter";
  for(const p of particles){
    const a=clamp(p.life/p.max,0,1); ctx.globalAlpha=a;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*a,0,TAU); ctx.fillStyle=p.color;ctx.fill();
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
}

function drawRings(){
  ctx.globalCompositeOperation="lighter";
  for(const w of rings){
    const a=clamp(w.life/w.max,0,1);
    ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,TAU); ctx.strokeStyle=w.color || "rgba(167,139,250,0.9)";
    ctx.globalAlpha = a * 0.9; ctx.lineWidth=4+a*10;ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
}

function drawTexts(){
  ctx.textAlign="center";ctx.textBaseline="middle";
  for(const t of texts){
    const a=clamp(t.life/t.max,0,1); ctx.globalAlpha=a;
    ctx.font="900 "+t.size+"px 'Share Tech Mono', system-ui,sans-serif"; ctx.fillStyle=t.color;ctx.fillText(t.txt,t.x,t.y);
  }
  ctx.globalAlpha=1;
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBG();
  if (S.state === "menu" || S.state === "modeSelect" || S.state === "splash" || S.state === "thanks") {
    if (S.state === "menu") drawCrosshair();
    return;
  }
  
  ctx.save();
  if(S.shake>.4)ctx.translate(rand(-S.shake,S.shake)*.5,rand(-S.shake,S.shake)*.5);
  drawRings();drawOrbs();drawEnemies();drawBoss();drawReaper();drawLasers();drawBullets();drawEBullets();drawCoinsDrop();
  drawDevourerAnim();
  drawBlackHole();
  drawPlayer();drawDrones();drawParticles();drawTexts();
  ctx.restore();
  
  drawCrosshair();
}

function updateHUD(){
  if(!player)return;
  hpFill.style.width=clamp((player.hp/player.maxHp)*100,0,100)+"%";
  expFill.style.width=clamp((S.exp/S.expNext)*100,0,100)+"%";
  
  const modeName = currentLang === "en" 
    ? ["Straight", "Radial", "Laser"][player.bulletMode]
    : ["直行子弹", "环形子弹", "呼吸激光"][player.bulletMode];
    
  let extra = "";
  if (grimReaper) extra = " · " + I18N[currentLang].msg_void;
  else if (S.madnessTimer > 0) extra = " · MADNESS: " + Math.ceil(S.madnessTimer) + "s";
  
  statsEl.innerHTML="Lv.<b>"+S.level+"</b> · "+modeName+" · Kills <b>"+S.kills+"</b> · <span class='coin'>💰"+S.coins+"</span>"+extra;
  
  const ratio=player.waveMax>0?1-player.waveCd/player.waveMax:1;
  skillFill.style.width=clamp(ratio*100,0,100)+"%";
  
  let skillLabel = I18N[currentLang].skill_pulse;
  if (player.charId === 1) skillLabel = I18N[currentLang].skill_puppet;
  else if (player.charId === 2) skillLabel = I18N[currentLang].skill_devourer;

  skillText.textContent = player.waveCd > 0
    ? I18N[currentLang].recharging + player.waveCd.toFixed(1) + "s"
    : skillLabel + I18N[currentLang].ready;
}

function handleLevelUp() {
  if (S.level % 20 === 0 && !boss && !grimReaper && S.madnessTimer <= 0) {
    spawnBoss();
  }
  const isEvolveLevel = (S.level === 20 || S.level === 40 || S.level === 60);
  if (isEvolveLevel) showWeaponEvolve();
  else showNormalLevelUp();
}

function showWeaponEvolve() {
  S.state="levelup";
  S.savedMouseX = mouse.x;
  S.savedMouseY = mouse.y;
  
  if (document.pointerLockElement) document.exitPointerLock();
  
  S.shake = Math.max(S.shake, 15);
  explode(player.x, player.y, "#0ff", 30, 400);
  
  document.getElementById("overlay").classList.remove("hidden");

  document.getElementById("selectCharPanel").classList.add("hidden");
  document.getElementById("selectBulletPanel").classList.add("hidden");
  document.getElementById("shop").classList.add("hidden");
  document.getElementById("settings").classList.add("hidden");
  document.getElementById("gameover").classList.add("hidden");
  
  levelupEl.classList.remove("hidden");
  menuEl.classList.add("hidden");
  
  levelupTitle.innerHTML = currentLang === "en" ? "[ WEAPON EVOLUTION ]" : "[ 武器形态进化 ]";
  cardsEl.innerHTML = "";

  const opts = [];
  opts.push({
    icon: "◎", color: "#ffd166", name: I18N[currentLang].up_evolve, 
    desc: I18N[currentLang].up_evolve_desc,
    apply() { player.dmg *= 1.3; }
  });

  if (progress.inventory.radial && player.bulletMode !== 1) {
    opts.push({
      icon: "◎", color: "#fcd34d", name: I18N[currentLang].w_radial, 
      desc: I18N[currentLang].desc_radial,
      apply() { player.bulletMode = 1; }
    });
  }

  if (progress.inventory.laser && player.bulletMode !== 2) {

      desc: I18N[currentLang].desc_laser,
      apply() { player.bulletMode = 2; }
    });
  }

  if (S.level >= 60 && player.bulletMode !== 0) {
    opts.push({
      icon: "⊸", color: "#7dd3fc", name: I18N[currentLang].w_straight,
      desc: I18N[currentLang].desc_straight,
      apply() { player.bulletMode = 0; }
    });
  }

  opts.forEach(u => {
    const div = document.createElement("div");
    div.className = "card";
    applyCardAccent(div, u.color);
    div.innerHTML = '<div class="cyber-icon">'+u.icon+'</div><div class="name">'+u.name+'</div><div class="desc">'+u.desc+'</div>';
    div.addEventListener("click", () => chooseUpgrade(u, true));
    cardsEl.appendChild(div);
  });

function showNormalLevelUp(){
  S.state="levelup";
  S.savedMouseX = mouse.x;
  S.savedMouseY = mouse.y;
  
  if (document.pointerLockElement) document.exitPointerLock();
  
  S.shake = Math.max(S.shake, 10);
  explode(player.x, player.y, "#0ff", 20, 300);
  
  document.getElementById("overlay").classList.remove("hidden");
  
  document.getElementById("selectCharPanel").classList.add("hidden");
  document.getElementById("selectBulletPanel").classList.add("hidden");
  document.getElementById("shop").classList.add("hidden");
  document.getElementById("settings").classList.add("hidden");
  document.getElementById("gameover").classList.add("hidden");
  
  levelupEl.classList.remove("hidden");
  menuEl.classList.add("hidden");
  
  levelupTitle.innerHTML = currentLang === "en" ? "[ SYSTEM UPGRADE ]" : "[ 系统升级 ]";
  
  let pool = UPGRADES.filter(u=>{
    if (u.id === "crit" && player.crit >= 1.0) return false;
    if (u.id === "wavedmg" && (player.charId === 1 || player.charId === 2)) return false;
    return (player.taken[u.id]||0) < u.max;
  });

  if (player.charId === 1) {
    pool = pool.concat(CHAR_UPGRADES.puppet.filter(u => (player.taken[u.id]||0) < u.max));
  } else if (player.charId === 2) {
    pool = pool.concat(CHAR_UPGRADES.devourer.filter(u => (player.taken[u.id]||0) < u.max));
  }
  
  const picks=[];
  const rest = pool.slice();
  
  for(let i=0;i<3&&rest.length>0;i++){
    let totalWeight = 0;
    for(let u of rest) totalWeight += (u.weight !== undefined ? u.weight : 1.0);
    
    let r = Math.random() * totalWeight;
    let selectedIdx = 0;
    for(let j=0;j<rest.length;j++){
      let w = (rest[j].weight !== undefined ? rest[j].weight : 1.0);
      if (r < w) { selectedIdx = j; break; }
      r -= w;
    }
    picks.push(rest.splice(selectedIdx, 1)[0]);
  }
  
  if(picks.length===0) {
    picks.push({
      icon:"✚", color:"#f472b6",
      name:{en:"Supply",zh:"补给"},
      desc:{en:"Heal 30",zh:"回复30血"},
      apply(){player.hp=Math.min(player.maxHp,player.hp+30);}
    });
  }
  
  cardsEl.innerHTML="";
  picks.forEach(u=>{
    const div=document.createElement("div");
    div.className="card";
    applyCardAccent(div, u.color || "#0ff");
    
    const descStr = getUpgradeDesc(u);
    const nameStr = getUpgradeName(u);

    div.innerHTML='<div class="cyber-icon">'+u.icon+'</div><div class="name">'+nameStr+'</div><div class="desc">'+descStr+'</div>';
    div.addEventListener("click",()=>chooseUpgrade(u, false));
    cardsEl.appendChild(div);
  });
  beep(660,.14,"sine",.05,990);
}

function chooseUpgrade(u, isEvolve){
  u.apply();
  if(u.id) player.taken[u.id]=(player.taken[u.id]||0)+1;
  beep(880,.16,"sine",.06,1320);
  
  mouse.x = S.savedMouseX;
  mouse.y = S.savedMouseY;
  player.x = mouse.x;
  player.y = mouse.y;
  
  levelupEl.classList.add("hidden");
  S.state="playing";
  
  if (cvs.requestPointerLock) cvs.requestPointerLock();
  
  if(tryLevelUp()) handleLevelUp(); 
  else overlay.classList.add("hidden");
}

function startGame(bulletMode = 0){

  player=makePlayer();
  player.x=W/2;player.y=H/2;
  mouse.x=W/2;mouse.y=H/2;

  player.charId = selectedChar;
  if (selectedChar === 1) {
    player.waveMax = 14;
  } else if (selectedChar === 2) {
    player.waveMax = 16;
  }

  if (localStorage.getItem('stardust_perk_hp') === 'true') {
    player.maxHp += 50; player.hp += 50;
  }
  if (localStorage.getItem('stardust_perk_dmg') === 'true') {
    player.dmg *= 1.1;
  }

  if (progress.upgrades.straight) {
    player.fireRate *= 1.3;
    player.dmg *= 1.2;
  }
  if (progress.upgrades.laser) {
    player.pierce += 1;
    player.dmg *= 1.2;
  }
  if (progress.upgrades.radial) {
    player.bulletCount += 2;
  }

  player.bulletMode = bulletMode;
  
  enemies=[];bullets=[];orbs=[];particles=[];texts=[];rings=[];lasers=[];ebullets=[];coinsDrop=[];drones=[];
  boss=null; pillars=[]; grimReaper=null; blackHole=null; devourerAnim=null;
  dialogCallback = null;
  
  S.state="playing";S.elapsed=0;S.kills=0;S.level=1;S.coins=0;
  S.exp=0;S.expNext=expForLevel(1);S.spawnTimer=.35;S.shake=0;S.madnessTimer=0;
  S.bossIntroPause = false;
  
  hideBossDialog();
  stopBGM();
  
  document.getElementById("overlay").classList.add("hidden");
  menuEl.classList.add("hidden");
  document.getElementById("selectCharPanel").classList.add("hidden");
  document.getElementById("selectBulletPanel").classList.add("hidden");
  document.getElementById("settings").classList.add("hidden");
  levelupEl.classList.add("hidden");
  gameoverEl.classList.add("hidden");
  document.getElementById("victoryChest").classList.add("hidden");
  
  bossHud.classList.add("hidden");
  hudEl.classList.remove("hidden");
  skillHudEl.classList.remove("hidden");
  
  for(let i=0;i<3;i++) spawnEnemy();

    progress.coins += S.coins;

    blackHole = null;
    devourerAnim = null;
    dialogCallback = null;

    hideBossDialog();
    if (document.pointerLockElement) document.exitPointerLock();
    
    hudEl.classList.add("hidden");
    skillHudEl.classList.add("hidden");
    bossHud.classList.add("hidden");

function gameOver(win = false){
  if(S.state==="dead")return;
  S.state="dead";S.shake=22;
  blackHole = null;
  devourerAnim = null;
  dialogCallback = null;
  stopBGM();
  hideBossDialog();
  
  if (document.pointerLockElement) document.exitPointerLock();
  document.body.style.cursor = "default";
  
  progress.coins += S.coins;
  saveProgress();

  if(win) {
    gameoverTitle.innerText = I18N[currentLang].victory;
    gameoverTitle.setAttribute("data-text", I18N[currentLang].victory);
    gameoverTitle.style.color = "#fbbf24";
    gameoverTitle.style.textShadow = "0 0 10px #fbbf24, 0 0 20px #fbbf24";
    gameoverDesc.innerText = I18N[currentLang].win_desc;
    gameoverDesc.classList.remove("hidden");
    beep(600, 0.5, "sine", 0.1, 1200);
    setTimeout(()=>beep(800, 1.0, "sine", 0.1, 1600), 200);
  } else {
    gameoverTitle.innerText = I18N[currentLang].gameover;
    gameoverTitle.setAttribute("data-text", I18N[currentLang].gameover);
    gameoverTitle.style.color = "#fff";
    gameoverTitle.style.textShadow = "0 0 10px #f43f5e, 0 0 20px #f43f5e";
    gameoverDesc.classList.add("hidden");
    explode(player.x,player.y,COLOR_STAGES[player.colorStage].main,40,420);
  }

  finalStatsEl.innerHTML= currentLang === "en" 
    ? `Level <b>${S.level}</b> · Kills <b>${S.kills}</b> · Time <b>${fmt(S.elapsed)}</b><br>Earned <b style='color:#fbbf24'>${S.coins}</b> Coins`
    : `等级 <b>${S.level}</b> · 击杀 <b>${S.kills}</b> · 存活 <b>${fmt(S.elapsed)}</b><br>本局获得 <b style='color:#fbbf24'>${S.coins}</b> 星尘币`;
  
  document.getElementById("overlay").classList.remove("hidden");
  document.getElementById("selectCharPanel").classList.add("hidden");
  document.getElementById("selectBulletPanel").classList.add("hidden");
  document.getElementById("shop").classList.add("hidden");
  document.getElementById("settings").classList.add("hidden");
  levelupEl.classList.add("hidden");
  document.getElementById("victoryChest").classList.add("hidden");
  
  gameoverEl.classList.remove("hidden");
  menuEl.classList.add("hidden");
  hudEl.classList.add("hidden");
  skillHudEl.classList.add("hidden");
  bossHud.classList.add("hidden");
}

function returnToMenu(){
  loadProgress();
  if (document.pointerLockElement) document.exitPointerLock();
  S.state = "menu";
  document.body.style.cursor = "default";
  hideBossDialog();
  blackHole = null;
  devourerAnim = null;
  dialogCallback = null;
  
  overlay.classList.add("hidden");
  gameoverEl.classList.add("hidden");
  levelupEl.classList.add("hidden");
  settingsEl.classList.add("hidden");
  document.getElementById("selectCharPanel").classList.add("hidden");
  document.getElementById("selectBulletPanel").classList.add("hidden");
  document.getElementById("victoryChest").classList.add("hidden");
  hudEl.classList.add("hidden");
  skillHudEl.classList.add("hidden");
  bossHud.classList.add("hidden");
  
  showMenuFadeIn();
  
  stopBGM();
}

let isPointerLocked = false;

cvs.addEventListener('click', () => {
    if (dialogCallback) {
      advanceDialog();
      return;
    }
    if (S.state === 'playing' && !isPointerLocked) {
        cvs.requestPointerLock = cvs.requestPointerLock || cvs.mozRequestPointerLock;
        if (cvs.requestPointerLock) cvs.requestPointerLock();
    }
});

document.addEventListener('pointerlockchange', () => {
    isPointerLocked = (document.pointerLockElement === cvs || document.mozPointerLockElement === cvs);
    if (isPointerLocked) {
        document.body.style.cursor = 'none';
    } else {
        if (S.state === 'playing') {
            document.body.style.cursor = 'crosshair';
        } else {
            document.body.style.cursor = 'default';
        }
    }
});

window.addEventListener("pointermove", e => {
    if (S.state === "playing") {
        if (isPointerLocked) {
            mouse.x = clamp(mouse.x + e.movementX, 0, W);
            mouse.y = clamp(mouse.y + e.movementY, 0, H);
        } else {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        }
    }
});

window.addEventListener("keydown",e=>{
  if(e.code==="Tab"){
    e.preventDefault();
    if(S.state==="playing"){
      openSettings(true);
    } else if(S.state==="paused") {
      closeSettings();
    }
  }
  if(e.code==="Space"){
    e.preventDefault();
    if(S.state==="playing")fireSkillWave();
    else if(S.state==="menu"||S.state==="dead")showSelectChar();
  }
  if(e.code==="KeyF" && !e.ctrlKey && !e.altKey && !e.metaKey){
    toggleFullscreen();
  }
});

let lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTs)lastTs=ts;
  let dt=(ts-lastTs)/1000;lastTs=ts;
  if(!isFinite(dt)||dt<=0)dt=1/60;
  dt=Math.min(dt,.05);
  S.time+=dt;

  if (S.state === "modeSelect") {
    if (gearSpinState === "slow") {
      gearSpeed = 0.2;
    } else if (gearSpinState === "fast") {
      gearSpeed = Math.min(14, gearSpeed + dt * 14);
    } else if (gearSpinState === "stopping") {
      gearSpeed = Math.max(0, gearSpeed - dt * 5.5);
      if (gearSpeed <= 0) {
        gearSpinState = "done";
        enterFunMode();
      }
    }
    gearAngle += gearSpeed * dt;
  }
  
  let starSpeed = S.state === "menu" ? 5 : 1;
  for(const st of stars){st.y+=(8+st.z*34)*starSpeed*dt;if(st.y>H+4){st.y=-4;st.x=Math.random()*W;}}
  
  updateParticles(dt);updateTexts(dt);
  if(S.shake>0)S.shake=Math.max(0,S.shake-dt*55);
  
  if(S.state==="playing")updateGame(dt);
  
  if(S.state !== "menu" && S.state !== "levelup" && S.state !== "paused" && S.state !== "modeSelect" && S.state !== "splash" && S.state !== "thanks") updateHUD();
  render();
}

// ===== 初始化 =====
loadProgress();
hudEl.classList.add("hidden");
skillHudEl.classList.add("hidden");
menuEl.classList.add("hidden");
modeSelectEl.classList.add("hidden");
document.getElementById("overlay").classList.add("hidden");
document.getElementById("splashScreen").classList.add("hidden");
document.getElementById("thanksScreen").classList.add("hidden");
resize();
player=makePlayer();
initTitle();
updateLanguage("en");
startSplash();
requestAnimationFrame(loop);
</script>
</body>
