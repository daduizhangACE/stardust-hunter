function getUpgradeDesc(u) {
  const d = u && u.desc;
  if (!d) return "";
  const v = (d[currentLang] !== undefined) ? d[currentLang] : d.en;
  if (Array.isArray(v)) return v[player ? player.bulletMode : 0] || v[0] || "";
  return v || "";
}
function getUpgradeName(u) {
  if (!u || !u.name) return "";
  return u.name[currentLang] || u.name.en || "";
}

const TYPES={
  grunt:{r:14,hp:26,speed:64,dmg:10,color:"#fb7185",exp:1,sides:4,big:false,wob:false},
  fast:{r:10,hp:16,speed:124,dmg:8,color:"#fbbf24",exp:1,sides:3,big:false,wob:false},
  orb:{r:16,hp:46,speed:54,dmg:12,color:"#34d399",exp:2,sides:8,big:false,wob:true},
  tank:{r:25,hp:120,speed:40,dmg:18,color:"#a78bfa",exp:4,sides:6,big:true,wob:false},
};
function pickType(){
  const t=S.elapsed,r=Math.random();
  if(t<10)return r<.85?"grunt":"fast";
  if(t<25)return r<.55?"grunt":r<.82?"fast":"orb";
  if(t<45)return r<.4?"grunt":r<.68?"fast":r<.88?"orb":"tank";
  return r<.32?"grunt":r<.58?"fast":r<.8?"orb":"tank";
}
function spawnEnemy(){
  if(enemies.length>=160)return;
  const t=TYPES[pickType()];
  const side=randInt(0,3);let x,y;const pad=70;
  if(side===0){x=rand(0,W);y=-pad;}
  else if(side===1){x=W+pad;y=rand(0,H);}
  else if(side===2){x=rand(0,W);y=H+pad;}
  else{x=-pad;y=rand(0,H);}
  
  const levelTier = Math.floor(S.level / 10);
  let hpScale = 1 + S.elapsed / 48 + levelTier * 0.5;
  if (player && player.bulletMode === 1) hpScale *= 2.5; 
  
  const dmgScale = 1 + S.elapsed / 150 + (S.level - 1) * 0.06;
  const ss=1+S.elapsed/220;
  
  enemies.push({x,y,r:t.r,hp:t.hp*hpScale,maxHp:t.hp*hpScale,speed:t.speed*ss,
    dmg:t.dmg*dmgScale, color:t.color,exp:t.exp,sides:t.sides,big:t.big,wob:t.wob,
    phase:Math.random()*TAU,rot:Math.random()*TAU,rotSpd:rand(-2.4,2.4),flash:0,dead:false});
}

function explode(x,y,color,n,spd){
  for(let i=0;i<n;i++){
    if(particles.length>480)break;
    const a=Math.random()*TAU,s=rand(spd*.25,spd);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.28,.62),max:.62,r:rand(1.4,3.6),color});
  }
}

function addText(x,y,txt,color,size,duration){
  if(texts.length>70)return;
  const dur = duration || 0.7;
  texts.push({x,y,vy:-62,life:dur,max:dur,txt,color,size:size||13});
}

function nearestEnemy(){
  let best=null,bd=Infinity;
  for(const e of enemies){
    if(e.dead)continue;
    const d=d2(e.x,e.y,player.x,player.y);
    if(d<bd){bd=d;best=e;}
  }
  if(boss && !boss.dead && !boss.invulnerable){
    const d=d2(boss.x,boss.y,player.x,player.y);
    if(d<bd){bd=d;best=boss;}
  }
  if(grimReaper && grimReaper.state === "active"){
    const d=d2(grimReaper.x,grimReaper.y,player.x,player.y);
    if(d<bd){bd=d;best=grimReaper;}
  }
  return best;
}

function shootStraight(t){
  const base=Math.atan2(t.y-player.y,t.x-player.x);
  const n=player.bulletCount;
  for(let i=0;i<n;i++){
    const a=base+(i-(n-1)/2)*player.spread;
    bullets.push({x:player.x+Math.cos(a)*player.r,y:player.y+Math.sin(a)*player.r,
      vx:Math.cos(a)*player.bulletSpeed,vy:Math.sin(a)*player.bulletSpeed,
      r:4,dmg:player.dmg,pierce:player.pierce,hits:new Set(),life:1.7, color:"#e0f2fe"});
  }
  beep(rand(760,900),.045,"square",.014,420);
}

function shootRadial(){
  const n = 8 + player.bulletCount * 4;
  const rot = S.time * 2;
  const spd = player.bulletSpeed * 0.45; 
  for(let i=0;i<n;i++){
    const a=(i/n)*TAU + rot;
    bullets.push({x:player.x+Math.cos(a)*player.r,y:player.y+Math.sin(a)*player.r,
      vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      r:4,dmg:player.dmg*.7,pierce:player.pierce,hits:new Set(),life:2.2, color:"#fcd34d", isRadial:true});
  }
  beep(400,.1,"sine",.02,600);
}

function fireLaser() {
  let baseAngle = 0;
  const target = nearestEnemy();
  if (target) baseAngle = Math.atan2(target.y - player.y, target.x - player.x);
  else baseAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  
  const len = 2500;
  const n = player.bulletCount; 
  const spreadAngle = 0.12;
  let baseDmg = player.dmg * 3.5 * (1 + player.pierce * 0.25);
  const beamWidth = 16 + player.pierce * 8;
  
  for (let i = 0; i < n; i++) {
    const angle = baseAngle + (i - (n - 1) / 2) * spreadAngle;
    const ex = player.x + Math.cos(angle) * len;
    const ey = player.y + Math.sin(angle) * len;
    
    enemies.forEach(e => {
      if (e.dead) return;
      const dist = distToSegment(e.x, e.y, player.x, player.y, ex, ey);
      if (dist < e.r + beamWidth / 2) {
        let dmg = baseDmg;
        const crit = Math.random() < player.crit;
        if (crit) dmg *= player.critMul;
        damageEnemy(e, dmg, crit);
        explode(e.x, e.y, COLOR_STAGES[player.colorStage].glow, 5, 150);
      }
    });

    if (boss && !boss.dead && !boss.invulnerable) {
      const dist = distToSegment(boss.x, boss.y, player.x, player.y, ex, ey);
      if (dist < boss.r + beamWidth / 2) {
        let dmg = baseDmg;
        const crit = Math.random() < player.crit;
        if (crit) dmg *= player.critMul;
        dealDamageToBoss(dmg, crit);
      }
    }

    pillars.forEach(p => {
      if (p.dead) return;
      const dist = distToSegment(p.x, p.y, player.x, player.y, ex, ey);
      if (dist < p.r + beamWidth / 2) {
        dealDamageToPillar(p, baseDmg);
      }
    });
    
    if (boss && boss.minions) {
      boss.minions.forEach(m => {
        if (m.dead) return;
        const dist = distToSegment(m.x, m.y, player.x, player.y, ex, ey);
        if (dist < m.r + beamWidth / 2) {
          dealDamageToMinion(m, baseDmg);
        }
      });
    }
    
    if (grimReaper && grimReaper.state === "active") {
      const dist = distToSegment(grimReaper.x, grimReaper.y, player.x, player.y, ex, ey);
      if (dist < grimReaper.r + beamWidth / 2) {
        dealDamageToReaper(baseDmg, false);
      }
    }
    
    lasers.push({
      x1: player.x, y1: player.y, x2: ex, y2: ey,
      life: 0.25, max: 0.25, color: COLOR_STAGES[player.colorStage].glow,
      width: beamWidth
    });
  }
  S.shake = Math.max(S.shake, 12);
  beep(800, 0.25, "sawtooth", 0.08, 150);
}

function damageEnemy(e,dmg,crit){
  if(e.dead)return;
  e.hp-=dmg;e.flash=.1;
  addText(e.x+rand(-7,7),e.y-e.r,crit?Math.round(dmg)+"!":String(Math.round(dmg)),
    crit?"#fbbf24":"rgba(255,255,255,.88)",crit?18:13);
  if(e.hp<=0)killEnemy(e);
}

function killEnemy(e){
  if(e.dead)return;
  e.dead=true;S.kills++;
  explode(e.x,e.y,e.color,e.big?22:10,e.big?320:210);
  
  let baseShake = e.big ? 9 : 3;
  if (player && player.bulletMode === 1) baseShake *= 0.3;
  S.shake = Math.max(S.shake, baseShake);
  
  let dropChance = e.big ? 0.6 : 0.15;
  if (Math.random() < dropChance) {
    let amt = e.big ? randInt(3,6) : randInt(1,2);
    for(let k=0;k<amt;k++){
      coinsDrop.push({ x: e.x, y: e.y, vx: rand(-60,60), vy: rand(-60,60), life: 15, rot: rand(0,TAU) });
    }
  }

  let orbColor = "#38bdf8"; 
  if (e.maxHp > 100) orbColor = "#34d399"; 
  if (e.maxHp > 250) orbColor = "#ffffff"; 
  
  let n = Math.max(1, Math.floor(e.maxHp / 12));
  while(n>0){
    const v=Math.min(n, Math.ceil(e.maxHp / 30) || 1);
    orbs.push({
      x:e.x,y:e.y, vx:rand(-90,90),vy:rand(-90,90),
      v, r:3 + Math.min(v*0.4, 5), rot:Math.random()*TAU, color: orbColor
    });
    n-=v;
  }
  
  if(player.lifesteal>0 && Math.random() < 0.15) {
    player.hp=Math.min(player.maxHp,player.hp+player.lifesteal);
    addText(player.x, player.y - 20, "+" + player.lifesteal, "#34d399", 14);
  }
}

function hurtPlayer(dmg, isDrain=false){
  if(player.inv>0 && !isDrain)return;
  player.hp-=dmg;
  if(!isDrain) player.inv=1.0;
  S.shake=Math.max(S.shake,9);
  if(!isDrain) beep(190,.14,"sawtooth",.055,80);
  explode(player.x,player.y,"#fb7185",isDrain?2:12,220);
  if(player.hp<=0){player.hp=0;gameOver();}
}

function fireSkillWave(){
  if(S.state!=="playing"||!player||player.waveCd>0)return;
  if(player.charId === 1){ summonDrones(); return; }
  if(player.charId === 2){ castBlackHole(); return; }
  
  player.waveCd=player.waveMax;
  S.shake=Math.max(S.shake,15);
  rings.push({x:player.x,y:player.y,r:20,maxR:player.waveR,life:.5,max:.5, color:"#a78bfa"});
  beep(140,.38,"sine",.1,42);
  const snap=enemies.slice();
  for(const e of snap){
    if(e.dead)continue;
    const d=Math.hypot(e.x-player.x,e.y-player.y);
    if(d<player.waveR+e.r){
      const dx=(e.x-player.x)/(d||1),dy=(e.y-player.y)/(d||1);
      e.x+=dx*70;e.y+=dy*70;
      damageEnemy(e,player.waveDmg,false);
    }
  }
  if (boss && !boss.dead && !boss.invulnerable) {
    const d = Math.hypot(boss.x - player.x, boss.y - player.y);
    if (d < player.waveR + boss.r) dealDamageToBoss(player.waveDmg, false);
  }
  pillars.forEach(p => {
    if (p.dead) return;
    const d = Math.hypot(p.x - player.x, p.y - player.y);
    if (d < player.waveR + p.r) dealDamageToPillar(p, player.waveDmg);
  });
  if (boss && boss.minions) {
    boss.minions.forEach(m => {
      if (m.dead) return;
      const d = Math.hypot(m.x - player.x, m.y - player.y);
      if (d < player.waveR + m.r) dealDamageToMinion(m, player.waveDmg);
    });
  }
  if (grimReaper && grimReaper.state === "active") {
    const d = Math.hypot(grimReaper.x - player.x, grimReaper.y - player.y);
    if (d < player.waveR + grimReaper.r) dealDamageToReaper(player.waveDmg, false);
  }
  for(let i=0;i<30;i++){
    const a=(i/30)*TAU;
    particles.push({x:player.x+Math.cos(a)*24,y:player.y+Math.sin(a)*24,
      vx:Math.cos(a)*rand(260,460),vy:Math.sin(a)*rand(260,460),
      life:.5,max:.5,r:rand(2,4),color:"#a78bfa"});
  }
}

function summonDrones(){
  if(S.state!=="playing"||!player||player.waveCd>0)return;
  player.waveCd = player.waveMax;
  S.shake = Math.max(S.shake, 10);
  
  const baseAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  const n = Math.max(2, player.droneCount || 2);
  for(let i=0;i<n;i++){
    const off = (i - (n-1)/2) * 0.7;
    drones.push({
      angle: baseAngle + off,
      orbit: 44 + Math.abs(off) * 14,
      x: player.x + Math.cos(baseAngle + off) * 30,
      y: player.y + Math.sin(baseAngle + off) * 30,
      life: 8, max: 8, fireCd: 0.15 * i, rot: Math.random() * TAU
    });
  }
  if (drones.length > 10) drones.splice(0, drones.length - 10);
  
  for(let i=0;i<26;i++){
    const a = (i/26)*TAU;
    particles.push({
      x: player.x + Math.cos(a)*20, y: player.y + Math.sin(a)*20,
      vx: Math.cos(a)*rand(180,360), vy: Math.sin(a)*rand(180,360),
      life:.55, max:.55, r:rand(2,4), color:"#c084fc"
    });
  }
  rings.push({x:player.x,y:player.y,r:20,maxR:120,life:.45,max:.45,color:"#c084fc"});
  beep(520,.22,"triangle",.07,880);
  beep(760,.16,"sine",.05,1100);
}

function castBlackHole(){
  if(S.state!=="playing"||!player||player.waveCd>0)return;
  player.waveCd = player.waveMax;
  S.shake = Math.max(S.shake, 18);
  blackHole = {
    x: player.x, y: player.y,
    r: 22, maxR: player.waveR * 0.95,
    life: 5, max: 5,
    tick: 0, rot: 0
  };
  rings.push({x:player.x,y:player.y,r:20,maxR:player.waveR,life:.6,max:.6,color:"#a855f7"});
  for(let i=0;i<40;i++){
    const a = Math.random()*TAU;
    particles.push({
      x: player.x + Math.cos(a)*40, y: player.y + Math.sin(a)*40,
      vx: -Math.cos(a)*rand(120,320), vy: -Math.sin(a)*rand(120,320),
      life: .6, max: .6, r: rand(2,4.5), color: "#c084fc"
    });
  }
  beep(90, 0.9, "sawtooth", 0.12, 25);
  if (actx) beep(60, 1.2, "square", 0.06, 15);
}

function updateBlackHole(dt){
  if(!blackHole) return;
  const bh = blackHole;
  bh.life -= dt;
  bh.rot += dt * 4;
  bh.r += (bh.maxR - bh.r) * Math.min(1, dt * 2.5);
  bh.x += (player.x - bh.x) * Math.min(1, dt * 6);
  bh.y += (player.y - bh.y) * Math.min(1, dt * 6);

  const eatR = bh.r * 1.7;
  const killR = bh.r * 0.4;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.dead) continue;
    const dx = bh.x - e.x, dy = bh.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d < eatR) {
      const pull = 320 + (1 - d / eatR) * 700;
      e.x += (dx / d) * pull * dt;
      e.y += (dy / d) * pull * dt;
    }
    if (d < killR + e.r) {
      explode(e.x, e.y, "#a855f7", 8, 180);
      killEnemy(e);
    }
  }

  bh.tick -= dt;
  if (bh.tick <= 0) {
    bh.tick = 0.5;
    if (boss && !boss.dead && !boss.invulnerable && boss.state !== "intro" && boss.state !== "lastwords" && boss.state !== "dying" && boss.state !== "splitting") {
      const bd = Math.hypot(boss.x - bh.x, boss.y - bh.y);
      if (bd < bh.r * 1.6 + boss.r) {
        const dmg = boss.maxHp * 0.015 * (player.holeDmgMul || 1);
        dealDamageToBoss(dmg, false);
        explode(boss.x + rand(-boss.r, boss.r), boss.y + rand(-boss.r, boss.r), "#a855f7", 5, 200);
      }
    }
    if (grimReaper && grimReaper.state === "active") {
      const gd = Math.hypot(grimReaper.x - bh.x, grimReaper.y - bh.y);
      if (gd < bh.r * 1.6 + grimReaper.r) {
        dealDamageToReaper(grimReaper.maxHp * 0.004 * (player.holeDmgMul || 1), false);
      }
    }
    if (pillars.length) {
      pillars.forEach(p => {
        if (p.dead) return;
        const pd = Math.hypot(p.x - bh.x, p.y - bh.y);
        if (pd < bh.r * 1.6 + p.r) dealDamageToPillar(p, p.maxHp * 0.04 * (player.holeDmgMul || 1));
      });
    }
  }

  if (Math.random() < 0.75 && particles.length < 420) {
    const a = Math.random() * TAU;
    const rr = bh.r * rand(1.1, 1.6);
    particles.push({
      x: bh.x + Math.cos(a) * rr,
      y: bh.y + Math.sin(a) * rr,
      vx: -Math.cos(a) * 300, vy: -Math.sin(a) * 300,
      life: 0.35, max: 0.35, r: rand(1.4, 3), color: "#c084fc"
    });
  }

  if (bh.life <= 0) {
    explode(bh.x, bh.y, "#a855f7", 46, 420);
    S.shake = Math.max(S.shake, 22);
    blackHole = null;
  }
}

function spawnBoss() {
  const tier = Math.floor(S.level / 20); 
  let hpMult = 1;
  if (tier === 2) hpMult = 4; 
  if (tier === 3) hpMult = 8; 
  
  const hpBase = 2500 * hpMult * (1 + S.elapsed / 40);
  
  const configs = [
    { nameKey: "boss_blood", introKey: "boss_line_intro_blood", lastKey: "boss_line_last_blood", color: "#f43f5e", border: "#be123c", type: 1, theme: "blood" },
    { nameKey: "boss_void", introKey: "boss_line_intro_void", lastKey: "boss_line_last_void", color: "#a855f7", border: "#7e22ce", type: 2, theme: "void" },
    { nameKey: "boss_overlord", introKey: "boss_line_intro_overlord", lastKey: "boss_line_last_overlord", color: "#fbbf24", border: "#b45309", type: 3, theme: "overlord" }
  ];
  const cfg = configs[clamp(tier-1, 0, 2)];
  const bossTitle = I18N[currentLang][cfg.nameKey];

  boss = {
    x: W / 2, y: -100, r: 45 + tier * 10,
    hp: hpBase, maxHp: hpBase, 
    speed: 30 + tier * 10,
    type: cfg.type, phase: 1, 
    timer: 0,
    state: "intro", 
    dead: false, invulnerable: true,
    clones: [], minions: [],
    nameKey: cfg.nameKey,
    introKey: cfg.introKey,
    lastKey: cfg.lastKey,
    color: cfg.color,
    border: cfg.border,
    theme: cfg.theme,
    tier: tier
  };
  
  pillars = [];
  clearBattlefield();
  S.bossIntroPause = true;

  bossHud.classList.remove("hidden");
  bossName.innerText = bossTitle;
  bossName.style.color = cfg.color;
  bossBar.style.color = cfg.border;
  bossFill.style.background = `linear-gradient(90deg, ${cfg.border}, ${cfg.color})`;
  updateBossHUD();

  showBossDialog(bossTitle, I18N[currentLang][cfg.introKey], cfg.color, cfg.theme, () => {
    S.shake = 24;
    if (!boss) return;
    boss.state = "idle";
    boss.timer = 0;
    boss.invulnerable = false;
    S.bossIntroPause = false;
    updateBossHUD();
    beep(220, 0.5, "sawtooth", 0.12, 60);
  });
  beep(150, 0.8, "sawtooth", 0.1, 50);
  playBGM(cfg.type === 3 ? 3 : (cfg.type === 2 ? 2 : 1));
}

function updateBossHUD() {
  if(!boss) return;
  const pct = Math.max(0, (boss.hp / boss.maxHp) * 100);
  bossFill.style.width = pct + "%";
  bossText.innerText = Math.ceil(boss.hp) + " / " + Math.ceil(boss.maxHp);
  
  if (boss.invulnerable && boss.state !== "intro" && boss.state !== "splitting") bossShieldText.classList.remove("hidden");
  else bossShieldText.classList.add("hidden");
}

function dealDamageToBoss(dmg, crit) {
  if (!boss || boss.dead || boss.invulnerable) return;
  if (boss.state === "dying" || boss.state === "lastwords" || boss.state === "intro" || boss.state === "splitting") return;
  boss.hp -= dmg;
  updateBossHUD();
  addText(boss.x + rand(-20,20), boss.y - boss.r, crit ? Math.round(dmg)+"!" : Math.round(dmg), crit?"#fbbf24":"#fff", crit?20:14);
  
  if (boss.hp <= boss.maxHp * 0.5 && boss.phase === 1) {
    triggerPhase2();
  }

  if (boss.hp <= 0) {
    boss.hp = 0;
    updateBossHUD();
    boss.state = "lastwords";
    boss.invulnerable = true;
    boss.timer = 0;
    ebullets = [];
    S.bossIntroPause = true;
    const bossTitle = I18N[currentLang][boss.nameKey];
    const capturedBoss = boss;
    showBossDialog(bossTitle, I18N[currentLang][boss.lastKey], boss.color, boss.theme, () => {
      if (!capturedBoss || boss !== capturedBoss) return;
      boss.state = "dying";
      boss.timer = boss.type === 1 ? 0.5 : (boss.type === 2 ? 0.35 : 1.4);
      ebullets = [];
    });
    beep(300, 1.0, "sine", 0.08, 80);
  }
}

function triggerPhase2() {
  boss.phase = 2;
  boss.invulnerable = true;
  boss.state = "transition";
  boss.timer = 1.5; 
  
  S.shake = 25;
  addText(boss.x, boss.y - 100, I18N[currentLang].msg_phase2, "#fff", 36);
  explode(boss.x, boss.y, "#fff", 60, 500);
  
  ebullets = [];
  
  if(boss.type === 2) {
    boss.clones = Array(3).fill().map(() => ({
      x: rand(100, W-100), y: rand(100, H-100),
      vx: rand(-100, 100), vy: rand(-100, 100)
    }));
  }

  if(boss.type === 3) {
    boss.x = W / 2;
    boss.y = H / 2 - 100;
    spawnPillars();
    boss.invulnerable = false; 
    boss.state = "idle";
  }
}

function spawnPillars() {
  pillars = [];
  const pad = 100;
  const hp = 1500 * Math.floor(S.level / 20);
  const positions = [
    {x: pad, y: pad}, {x: W - pad, y: pad},
    {x: pad, y: H - pad}, {x: W - pad, y: H - pad}
  ];
  for(let p of positions) {
    pillars.push({ x: p.x, y: p.y, r: 25, hp: hp, maxHp: hp, dead: false, fireCd: rand(1, 3) });
  }
}

function dealDamageToPillar(p, dmg) {
  if(p.dead) return;
  p.hp -= dmg;
  if(p.hp <= 0) {
    p.dead = true;
    explode(p.x, p.y, "#fbbf24", 30, 300);
    beep(300, 0.3, "square", 0.08, 100);
    if(pillars.every(pil => pil.dead)) {
      if(boss) {
        pillars = [];
        if (boss.type === 3) {
          boss.phase = 3;
          boss.invulnerable = true;
          boss.state = "phase3_transition";
          boss.timer = 2.0; 
          
          S.shake = 40;
          addText(W/2, H/2, I18N[currentLang].msg_final_twins, "#f43f5e", 46);
          beep(200, 1.5, "sawtooth", 0.15, 30);
          
          for(let i=0; i<80; i++){
            const a = Math.random()*TAU; const spd = rand(100, 600);
            particles.push({x:W/2, y:H/2, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, life:rand(0.5, 1.5), max:1.5, r:rand(2,6), color:"#f43f5e"});
          }
        } else {
          boss.invulnerable = false;
          addText(boss.x, boss.y, I18N[currentLang].msg_shield_broken, "#f43f5e", 30);
          beep(200, 0.5, "sawtooth", 0.1, 50);
        }
      }
    }
  }
}

function dealDamageToMinion(m, dmg) {
  if (m.dead) return;
  m.hp -= dmg;
  addText(m.x + rand(-10,10), m.y - m.r, Math.round(dmg), "#fff", 14);
  
  if (m.hp <= 0) {
    m.dead = true;
    explode(m.x, m.y, "#888", 40, 350);
    beep(250, 0.4, "square", 0.1, 50);
    
    if (boss && boss.minions && boss.minions.every(mi => mi.dead)) {
      boss.invulnerable = false;
      addText(boss.x, boss.y, I18N[currentLang].msg_twins_down, "#fbbf24", 40);
    }
  }
}

function spawnBloodShards(bx, by) {
  const hp = 320 + S.level * 18;
  const shardAngles = [0, Math.PI/2, Math.PI, Math.PI*1.5];
  const shardColors = ["#f43f5e", "#fb7185", "#be123c", "#e11d48"];
  for (let i = 0; i < 4; i++) {
    const a = shardAngles[i];
    const dist = 70;
    enemies.push({
      x: bx + Math.cos(a) * dist,
      y: by + Math.sin(a) * dist,
      r: 20,
      hp: hp, maxHp: hp,
      speed: 58,
      dmg: 18 + S.level * 0.4,
      color: shardColors[i],
      exp: 6,
      sides: 4,
      big: true,
      wob: false,
      phase: Math.random()*TAU,
      rot: Math.random()*TAU,
      rotSpd: rand(-2, 2),
      flash: 0, dead: false
    });
  }
}

function updateBoss(dt) {
  if (!boss) return;
  const levelDmgScale = 1 + Math.max(0, S.level - 20) * 0.06;

  if (boss.state === "intro") {
    const targetY = 150 + boss.type * 25;
    boss.y += (targetY - boss.y) * Math.min(1, dt * 1.4);
    return;
  }

  if (boss.state === "lastwords") {
    if (Math.random() < 0.25) {
      explode(boss.x + rand(-boss.r, boss.r), boss.y + rand(-boss.r, boss.r), boss.color, 3, 140);
    }
    return;
  }

  if (boss.state === "dying") {
    boss.timer -= dt;
    if (boss.type === 3) {
      S.shake = Math.max(S.shake, 18);
      if (Math.random() < 0.65) {
        explode(boss.x + rand(-boss.r, boss.r), boss.y + rand(-boss.r, boss.r), "#fff", 6, 260);
      }
    } else {
      S.shake = Math.max(S.shake, 4);
    }
    if (boss.timer <= 0) {
      if (boss.type === 1) {
        boss.state = "splitting";
        boss.timer = 1.2;
        S.shake = 12;
      } else if (boss.type === 2) {
        const bx = boss.x, by = boss.y;
        const bColor = boss.color;
        const bR = boss.r;
        devourerAnim = { 
          x: bx, y: by, t: 0, max: 2.4,
          bossColor: bColor, bossR: bR,
          spiralAngle: 0
        };
        boss = null;
        bossHud.classList.add("hidden");
        ebullets = [];
        S.bossIntroPause = false;
        stopBGM();
        beep(400, 0.8, "sine", 0.1, 1000);
      } else {
        const bx = boss.x, by = boss.y;
        explode(bx, by, boss.color, 90, 520);
        S.shake = 42;
        for (let i = 0; i < 36; i++) {
          orbs.push({ x: bx, y: by, vx: rand(-280, 280), vy: rand(-280, 280), v: 18, r: 7, rot: Math.random()*TAU, color: "#ffffff" });
          coinsDrop.push({ x: bx, y: by, vx: rand(-230,230), vy: rand(-230,230), life: 15, rot: rand(0,TAU) });
        }
        boss = null;
        bossHud.classList.add("hidden");
        ebullets = [];
        S.bossIntroPause = false;
        addText(bx, by - 40, I18N[currentLang].msg_overlord_down, "#fff", 50, 2.6);
        S.madnessTimer = 60;
        stopBGM();
        setTimeout(() => {
          addText(W/2, H/2 - 100, I18N[currentLang].msg_madness, "#f43f5e", 30, 4.5);
          addText(W/2, H/2 - 60, I18N[currentLang].msg_survive, "#fff", 24, 4.5);
        }, 1400);
        beep(400, 1.4, "sawtooth", 0.12, 20);
      }
    }
    return;
  }

  if (boss.state === "splitting") {
    boss.timer -= dt;
    S.shake = Math.max(S.shake, 5);
    if (boss.timer <= 0) {
      const bx = boss.x, by = boss.y;
      spawnBloodShards(bx, by);
      for (let i = 0; i < 24; i++) {
        orbs.push({ x: bx, y: by, vx: rand(-220, 220), vy: rand(-220, 220), v: 14, r: 6, rot: Math.random()*TAU, color: "#ffffff" });
        coinsDrop.push({ x: bx, y: by, vx: rand(-180,180), vy: rand(-180,180), life: 15, rot: rand(0,TAU) });
      }
      boss = null;
      bossHud.classList.add("hidden");
      ebullets = [];
      S.bossIntroPause = false;
      addText(bx, by - 40, I18N[currentLang].msg_overlord_down, "#fff", 50, 2.6);
      stopBGM();
      beep(400, 0.8, "sine", 0.1, 1000);
    }
    return;
  }
  
  if (boss.state === "transition" || boss.state === "phase3_transition") {
    boss.timer -= dt;
    S.shake = 15; 
    if (boss.timer <= 0) {
      if (boss.state === "phase3_transition") {
        const minionHp = 4000 * Math.floor(S.level / 20) * 5;
        boss.minions = [
          { type:1, x: W/4, y: H/2, r: 40, hp: minionHp, maxHp: minionHp, timer: 2, dead: false, color: "#888", spawnAnim: 1.0 },
          { type:2, x: W*0.75, y: H/2, r: 40, hp: minionHp, maxHp: minionHp, timer: 3, dead: false, color: "#888", state: "idle", clones: [], spawnAnim: 1.0 }
        ];
        explode(W/4, H/2, "#888", 40, 300);
        explode(W*0.75, H/2, "#888", 40, 300);
        beep(100, 0.5, "sawtooth", 0.1, 50);
        boss.invulnerable = true; 
      } else {
        boss.invulnerable = false;
      }
      boss.state = "idle";
      updateBossHUD();
    }
    return;
  }

  const dx = player.x - boss.x;
  const dy = player.y - boss.y;
  const dist = Math.hypot(dx, dy);

  if (boss.type === 1) {
    if (dist > 200) {
      boss.x += (dx / dist) * boss.speed * dt;
      boss.y += (dy / dist) * boss.speed * dt;
    } else {
      boss.x += Math.cos(S.time) * 50 * dt;
      boss.y += Math.sin(S.time) * 50 * dt;
    }
    
    boss.timer -= dt;
    if (boss.timer <= 0) {
      boss.timer = boss.phase === 1 ? 2.2 : 1.0; 
      const n = 12 + boss.phase * 6;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU + S.time;
        ebullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160, r: 8, dmg: 10, life: 4, type: 1, owner: boss });
      }
      if (boss.phase === 2) {
        const baseA = Math.atan2(dy, dx);
        for(let i=0; i<4; i++) {
          const a = baseA + i * Math.PI / 2;
          ebullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 280, vy: Math.sin(a) * 280, r: 10, dmg: 15, life: 3, type: 1, owner: boss });
        }
      }
      beep(300, 0.2, "square", 0.05, 100);
    }
  } 
  else if (boss.type === 2) {
    if (boss.clones && boss.clones.length > 0) {
      for (let c of boss.clones) {
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        if (c.x < 50 || c.x > W-50) c.vx *= -1;
        if (c.y < 50 || c.y > H-50) c.vy *= -1;
        const cd = Math.hypot(player.x - c.x, player.y - c.y);
        if (cd < player.r + boss.r * 0.8) hurtPlayer(30 * levelDmgScale);
      }
    }
    boss.timer -= dt;
    if (boss.state === "idle") {
      if (boss.timer <= 0) { boss.state = "invisible"; boss.timer = 0.8; }
    } else if (boss.state === "invisible") {
      if (boss.timer <= 0) {
        boss.x = rand(100, W-100); boss.y = rand(100, H-100);
        boss.state = "warning"; 
        boss.timer = 0.6; 
        
        const baseA = Math.atan2(player.y - boss.y, player.x - boss.x);
        boss.warnAngles = boss.phase === 1 ? [baseA] : [baseA - 0.2, baseA, baseA + 0.2];
        
        for(let a of boss.warnAngles) {
          const ex = boss.x + Math.cos(a)*2500; const ey = boss.y + Math.sin(a)*2500;
          lasers.push({ x1: boss.x, y1: boss.y, x2: ex, y2: ey, life: 0.6, max: 0.6, color: "rgba(168,85,247,0.8)", width: 2 });
        }
        beep(300, 0.6, "triangle", 0.05, 800);
      }
    } else if (boss.state === "warning") {
      if (boss.timer <= 0) {
        boss.state = "idle"; 
        boss.timer = boss.phase === 1 ? 3.5 : 2.0;
        
        for(let a of boss.warnAngles) {
          const ex = boss.x + Math.cos(a)*2500; const ey = boss.y + Math.sin(a)*2500;
          lasers.push({ x1: boss.x, y1: boss.y, x2: ex, y2: ey, life: 0.3, max: 0.3, color: "#a855f7", width: 80 });
          if (distToSegment(player.x, player.y, boss.x, boss.y, ex, ey) < player.r + 14) {
            hurtPlayer(25 * levelDmgScale);
          }
        }
        S.shake = 20; beep(600, 0.3, "sawtooth", 0.1, 200);
      }
    }
  }
  else if (boss.type === 3) {
    for (let p of pillars) {
      if (p.dead) continue;
      p.fireCd -= dt;
      if (p.fireCd <= 0) {
        p.fireCd = rand(2.5, 4.0);
        const a = Math.atan2(player.y - p.y, player.x - p.x);
        ebullets.push({ x: p.x, y: p.y, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160, r: 8, dmg: 12, life: 4, type: 3 });
        beep(200, 0.1, "triangle", 0.03, 100);
      }
    }
    if (boss.minions && boss.minions.length > 0) {
      for (let m of boss.minions) {
        if (m.dead) continue;
        if (m.spawnAnim > 0) m.spawnAnim -= dt; 

        const mdx = player.x - m.x; const mdy = player.y - m.y; const mdist = Math.hypot(mdx, mdy) || 1;
        if (m.type === 1) {
          if (mdist > 150) { m.x += (mdx / mdist) * 80 * dt; m.y += (mdy / mdist) * 80 * dt; }
          m.timer -= dt;
          if (m.timer <= 0) {
            m.timer = 2.5;
            const n = 12;
            for (let i = 0; i < n; i++) {
              const a = (i / n) * TAU + S.time;
              ebullets.push({ x: m.x, y: m.y, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, r: 8, dmg: 12, life: 4, type: 1, owner: m });
            }
            const baseA = Math.atan2(mdy, mdx);
            for(let i=0; i<4; i++) {
              const a = baseA + i * Math.PI / 2;
              ebullets.push({ x: m.x, y: m.y, vx: Math.cos(a) * 280, vy: Math.sin(a) * 280, r: 10, dmg: 15, life: 3, type: 1, owner: m });
            }
            beep(250, 0.2, "square", 0.05, 100);
          }
        } else if (m.type === 2) {
          if (m.clones && m.clones.length === 0) m.clones = Array(3).fill().map(() => ({ x: rand(100, W-100), y: rand(100, H-100), vx: rand(-150, 150), vy: rand(-150, 150) }));
          if (m.clones) {
            for (let c of m.clones) {
              c.x += c.vx * dt; c.y += c.vy * dt;
              if (c.x < 50 || c.x > W-50) c.vx *= -1;
              if (c.y < 50 || c.y > H-50) c.vy *= -1;
              const cd = Math.hypot(player.x - c.x, player.y - c.y);
              if (cd < player.r + m.r * 0.8) hurtPlayer(30 * levelDmgScale);
            }
          }
          m.timer -= dt;
          if (m.state === "idle") {
            if (m.timer <= 0) { m.state = "invisible"; m.timer = 0.6; }
          } else if (m.state === "invisible") {
            if (m.timer <= 0) { 
              m.x = rand(100, W-100); m.y = rand(100, H-100); 
              m.state = "warning"; m.timer = 0.6; 
              
              const baseA = Math.atan2(player.y - m.y, player.x - m.x);
              m.warnAngles = [baseA - 0.2, baseA, baseA + 0.2];
              
              for(let a of m.warnAngles) {
                const ex = m.x + Math.cos(a)*2500; const ey = m.y + Math.sin(a)*2500;
                lasers.push({ x1: m.x, y1: m.y, x2: ex, y2: ey, life: 0.6, max: 0.6, color: "rgba(136,136,136,0.8)", width: 2 });
              }
            }
          } else if (m.state === "warning") {
            if (m.timer <= 0) {
              m.state = "idle"; m.timer = 2.5;
              for(let a of m.warnAngles) {
                const ex = m.x + Math.cos(a)*2500; const ey = m.y + Math.sin(a)*2500;
                lasers.push({ x1: m.x, y1: m.y, x2: ex, y2: ey, life: 0.3, max: 0.3, color: "#888", width: 80 });
                if (distToSegment(player.x, player.y, m.x, m.y, ex, ey) < player.r + 14) hurtPlayer(20 * levelDmgScale);
              }
              S.shake = 15; beep(400, 0.3, "sawtooth", 0.1, 200);
            }
          }
        }
      }
    }
    boss.x += Math.cos(S.time * 1.5) * 80 * dt; boss.y += Math.sin(S.time * 1.5) * 80 * dt;
    if (pillars.length > 0 || (boss.minions && boss.minions.some(m => !m.dead))) boss.invulnerable = true;
    else if (boss.phase === 3) boss.invulnerable = false;
    updateBossHUD();

    boss.timer -= dt;
    if (boss.timer <= 0) {
      boss.timer = boss.phase === 1 ? 2.5 : 1.8;
      const baseA = Math.atan2(player.y - boss.y, player.x - boss.x);
      const count = boss.phase === 1 ? 9 : 15;
      
      let bulletSpd = 250;
      if (boss.phase === 3) {
        bulletSpd = 160;
        boss.timer += 0.3; 
      }
      
      for(let i=0; i<count; i++) {
        const off = (i - (count-1)/2) * 0.12;
        ebullets.push({ x: boss.x, y: boss.y, vx: Math.cos(baseA+off) * bulletSpd, vy: Math.sin(baseA+off) * bulletSpd, r: 12, dmg: 15, life: 3, type: 3 });
      }
      beep(400, 0.3, "triangle", 0.08, 100);
    }
  }

  if (boss) {
    boss.x = clamp(boss.x, boss.r, W - boss.r);
    boss.y = clamp(boss.y, boss.r, H - boss.r);
  }
}

function updateDevourerAnim(dt) {
  if (!devourerAnim) return;
  const da = devourerAnim;
  da.t += dt;
  da.spiralAngle = (da.spiralAngle || 0) + dt * 4.5;

  if (da.t > 0.25 && da.t < 2.0) {
    const rate = 0.7 + (da.t - 0.25) * 0.6;
    if (Math.random() < rate) {
      const a = Math.random() * TAU;
      const rr = 60 + Math.random() * 170;
      particles.push({
        x: da.x + Math.cos(a) * rr,
        y: da.y + Math.sin(a) * rr,
        vx: -Math.cos(a) * (300 + Math.random() * 220),
        vy: -Math.sin(a) * (300 + Math.random() * 220),
        life: 0.5, max: 0.5, r: rand(1.5, 4),
        color: Math.random() < 0.5 ? "#a855f7" : "#e9d5ff"
      });
    }
  }

  if (da.t >= da.max) {
    const bx = da.x, by = da.y;
    for (let i = 0; i < 24; i++) {
      orbs.push({ x: bx, y: by, vx: rand(-220, 220), vy: rand(-220, 220), v: 16, r: 6, rot: Math.random()*TAU, color: "#e9d5ff" });
      coinsDrop.push({ x: bx, y: by, vx: rand(-180,180), vy: rand(-180,180), life: 15, rot: rand(0,TAU) });
    }
    addText(bx, by - 40, I18N[currentLang].msg_overlord_down, "#fff", 50, 2.6);
    beep(400, 0.8, "sine", 0.1, 1000);
    devourerAnim = null;
  }
}

function drawDevourerAnim() {
  if (!devourerAnim) return;
  const da = devourerAnim;
  const t = da.t;
  const cx = da.x, cy = da.y;

  let holeR = 0;
  if (t < 0.4) holeR = (t / 0.4) * 36;
  else if (t < 1.9) holeR = 36 + ((t - 0.4) / 1.5) * 110;
  else holeR = Math.max(0, 146 * (1 - (t - 1.9) / 0.5));

  if (t > 0.15 && t < 2.0) {
    const absorbP = Math.min(1, Math.max(0, (t - 0.2) / 1.7));
    const r = da.bossR * (1 - absorbP * 0.88);
    const rotation = absorbP * 14;
    const alpha = Math.max(0, 1 - absorbP * 1.15);

    if (r > 2 && alpha > 0.04) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);
      ctx.scale(1 - absorbP * 0.35, 1 + absorbP * 0.7);
      ctx.globalAlpha = alpha;
      ctx.globalCompositeOperation = "source-over";

      ctx.beginPath();
      const n = 6;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU - Math.PI / 2;
        const rr = r * (i % 2 === 0 ? 1 : 0.75);
        const px = Math.cos(a) * rr;
        const py = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = "#2e1065";
      ctx.strokeStyle = "#a855f7";
      ctx.lineWidth = 2.5;
      ctx.shadowColor = "#a855f7";
      ctx.shadowBlur = 25;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.35, r * 0.2, rotation * 0.5, 0, TAU);
      ctx.fillStyle = "#e9d5ff";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.12, 0, TAU);
      ctx.fillStyle = "#1e1b4b";
      ctx.fill();

      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  if (holeR > 1) {
    ctx.save();
    ctx.translate(cx, cy);

    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(0, 0, holeR * 0.5, 0, 0, holeR * 2.2);
    g.addColorStop(0, "rgba(168,85,247,0.0)");
    g.addColorStop(0.35, "rgba(168,85,247,0.6)");
    g.addColorStop(0.7, "rgba(120,40,220,0.25)");
    g.addColorStop(1, "rgba(168,85,247,0)");
    ctx.beginPath(); ctx.arc(0, 0, holeR * 2.2, 0, TAU); ctx.fillStyle = g; ctx.fill();

    for (let i = 0; i < 5; i++) {
      const a = da.spiralAngle + i * TAU / 5;
      ctx.beginPath();
      ctx.arc(0, 0, holeR * 1.4, a, a + 0.7);
      ctx.strokeStyle = `rgba(192,132,252,${0.35 + Math.sin(da.spiralAngle + i) * 0.25})`;
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    ctx.globalCompositeOperation = "source-over";
    ctx.beginPath(); ctx.arc(0, 0, holeR, 0, TAU);
    ctx.fillStyle = "#000";
    ctx.fill();

    ctx.beginPath(); ctx.arc(0, 0, holeR, 0, TAU);
    ctx.strokeStyle = "#c084fc";
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.beginPath(); ctx.arc(0, 0, holeR * 0.7, 0, TAU);
    ctx.strokeStyle = "rgba(168,85,247,0.45)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
    ctx.globalCompositeOperation = "source-over";
  }
}

function spawnReaper() {
  if (grimReaper) return; 
  clearBattlefield();
  grimReaper = { 
    x: W/2, y: -150, r: 60, hp: 500000, maxHp: 500000,
    state: "intro"
  };
  S.madnessTimer = 0; 
  S.bossIntroPause = true;
  const title = I18N[currentLang].boss_devourer;
  addText(W/2, H/2, "⚠️ " + title + " ⚠️", "#ff2d2d", 46);
  showBossDialog(title, I18N[currentLang].boss_line_intro_devourer, "#ff2d2d", "reaper", () => {
    if (!grimReaper) return;
    grimReaper.state = "active";
    S.bossIntroPause = false;
    S.shake = 26;
    beep(180, 0.6, "sawtooth", 0.15, 40);
  });
  beep(80, 1.5, "sawtooth", 0.15, 20); stopBGM();
  if(actx) beep(50, 2.0, "square", 0.1, 10);
}

function dealDamageToReaper(dmg, crit) {
  if(!grimReaper) return;
  if (grimReaper.state !== "active") return;
  grimReaper.hp -= dmg;
  if (dmg >= 1) addText(grimReaper.x + rand(-20,20), grimReaper.y - grimReaper.r, Math.round(dmg), "#fff", 16);
  if(grimReaper.hp <= 0) {
    grimReaper.hp = 0;
    grimReaper.state = "lastwords";
    clearBattlefield();
    S.bossIntroPause = true;
    showBossDialog(I18N[currentLang].boss_devourer, I18N[currentLang].boss_line_last_devourer, "#ff2d2d", "reaper", () => {
      if (!grimReaper) return;
      grimReaper.state = "dying";
      grimReaper.dyingTimer = 2.2;
      S.bossIntroPause = false;
    });
    beep(300, 1.5, "sawtooth", 0.12, 40);
  }
}

function showVictoryChest() {
  S.state = "victory";
  blackHole = null;
  stopBGM();
  hideBossDialog();
  if (document.pointerLockElement) document.exitPointerLock();
  document.body.style.cursor = "pointer";
  const hintEl = document.getElementById("chestHint");
  if (hintEl) hintEl.innerText = I18N[currentLang].chest_hint;
  document.getElementById("victoryChest").classList.remove("hidden");
  beep(880, 0.3, "sine", 0.08, 1320);
  setTimeout(() => beep(1100, 0.3, "sine", 0.06, 1500), 180);
}

function openVictoryChest() {
  if (S.state !== "victory") return;
  S.state = "victory_open";
  const chest = document.getElementById("victoryChest");
  const burst = document.getElementById("chestBurst");
  burst.classList.remove("go");
  void burst.offsetWidth;
  burst.classList.add("go");
  beep(1200, 0.35, "sine", 0.1, 1800);
  if (actx) beep(1500, 0.5, "triangle", 0.06, 2400);
  setTimeout(() => {
    chest.classList.add("hidden");
    burst.classList.remove("go");
    document.body.style.cursor = "default";
    gameOver(true);
  }, 950);
}

function updateGame(dt){
  S.elapsed+=dt;
  if (S.state === "playing" && !grimReaper) {
    if (S.madnessTimer > 0) {
      S.madnessTimer -= dt;
      if (S.madnessTimer <= 0) spawnReaper();
    } else if (S.elapsed >= 30 * 60) spawnReaper();
  }
  
  let newStage = 0;
  if (S.level >= 40) newStage = 2; else if (S.level >= 20) newStage = 1;
  player.colorStage = newStage;

  const k=1-Math.exp(-player.follow*dt);
  player.x+=(mouse.x-player.x)*k; player.y+=(mouse.y-player.y)*k;
  player.x=clamp(player.x,player.r,W-player.r); player.y=clamp(player.y,player.r,H-player.r);
  
  if(player.inv>0)player.inv-=dt;
  if(player.regen>0 && !grimReaper)player.hp=Math.min(player.maxHp,player.hp+player.regen*dt);
  if(player.waveCd>0)player.waveCd=Math.max(0,player.waveCd-dt);

  for(let i=lasers.length-1; i>=0; i--){ lasers[i].life -= dt; if(lasers[i].life <= 0) lasers.splice(i, 1); }

  for(let i=drones.length-1;i>=0;i--){
    const d = drones[i];
    d.life -= dt;
    if(d.life <= 0){
      explode(d.x, d.y, "#c084fc", 10, 200);
      drones.splice(i, 1);
      continue;
    }
    d.angle += dt * 1.6;
    const tx = player.x + Math.cos(d.angle) * d.orbit;
    const ty = player.y + Math.sin(d.angle) * d.orbit;
    const kk = 1 - Math.exp(-10 * dt);
    d.x += (tx - d.x) * kk;
    d.y += (ty - d.y) * kk;
    d.rot += dt * 7;
    d.fireCd -= dt;
    if(d.fireCd <= 0){
      const t = nearestEnemy();
      if(t){
        d.fireCd = 0.42;
        const ang = Math.atan2(t.y - d.y, t.x - d.x);
        const droneSpeed = player.bulletSpeed * 0.75;
        const droneDmg = player.dmg * (player.droneDmgMul || 0.75);
        bullets.push({
          x: d.x, y: d.y,
          vx: Math.cos(ang) * droneSpeed, vy: Math.sin(ang) * droneSpeed,
          r: 3.5, dmg: droneDmg, pierce: 0,
          hits: new Set(), life: 1.5, color: "#e9d5ff"
        });
        beep(rand(1000,1200), 0.03, "square", 0.009, 700);
      } else {
        d.fireCd = 0.12;
      }
    }
  }

  updateBlackHole(dt);
  updateDevourerAnim(dt);

  player.fireCd-=dt;
  if (blackHole) {
    player.fireCd = 0;
  } else if(player.bulletMode === 2) {
    player.fireCd = 0; player.breathTimer += dt;
    const cycle = 2.0 * (640 / player.bulletSpeed); const phase = (player.breathTimer % cycle) / cycle;
    if (phase > 0.8) { if (!player.breathFired) { player.breathFired = true; fireLaser(); } } 
    else if (phase < 0.1) { player.breathFired = false; }
  } else {
    if(player.fireCd<=0){
      if (player.bulletMode === 0) {
        const t = nearestEnemy();
        if(t){ shootStraight(t); player.fireCd = 1 / player.fireRate; } else player.fireCd = 0;
      } else if (player.bulletMode === 1) { shootRadial(); player.fireCd = 1 / player.fireRate; }
    }
  }

  if (grimReaper) {
    if (grimReaper.state === "intro") {
      grimReaper.y += (180 - grimReaper.y) * Math.min(1, dt * 1.5);
    } else if (grimReaper.state === "lastwords") {
      if (Math.random() < 0.3) {
        explode(grimReaper.x + rand(-40,40), grimReaper.y + rand(-40,40), "#ff2d2d", 4, 180);
      }
    } else if (grimReaper.state === "dying") {
      grimReaper.dyingTimer -= dt;
      S.shake = Math.max(S.shake, 20);
      if (Math.random() < 0.75) {
        explode(grimReaper.x + rand(-grimReaper.r, grimReaper.r), grimReaper.y + rand(-grimReaper.r, grimReaper.r), "#ff2d2d", 5, 260);
      }
      if (grimReaper.dyingTimer <= 0) {
        hideBossDialog();
        explode(grimReaper.x, grimReaper.y, "#ff2d2d", 100, 550);
        if (!progress.inventory.devourer) {
          progress.inventory.devourer = true;
          saveProgress();
        }
        grimReaper = null;
        S.bossIntroPause = false;
        showVictoryChest();
      }
    } else {
      const dx = player.x - grimReaper.x; const dy = player.y - grimReaper.y; const dist = Math.hypot(dx, dy);
      if(dist > 0) { grimReaper.x += (dx / dist) * 650 * dt; grimReaper.y += (dy / dist) * 650 * dt; }
      player.hp -= player.maxHp * 0.05 * dt;
      if(player.hp <= 0) { player.hp = 0; gameOver(); }
    }
  }

  updateBoss(dt);
  const levelDmgScale = 1 + Math.max(0, S.level - 20) * 0.06;

  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -100 || b.x > W + 100 || b.y < -100 || b.y > H + 100) { ebullets.splice(i, 1); continue; }
    if (d2(b.x, b.y, player.x, player.y) < (b.r + player.r) * (b.r + player.r)) {
      hurtPlayer(b.dmg * levelDmgScale); ebullets.splice(i, 1);
      if(b.type === 1 && b.owner && !b.owner.dead) {
        const heal = Math.floor(b.owner.maxHp * 0.03);
        b.owner.hp = Math.min(b.owner.maxHp, b.owner.hp + heal);
        if (boss === b.owner) updateBossHUD();
        addText(b.owner.x, b.owner.y - 30, "+" + heal, "#34d399", 16);
      }
    }
  }

  for (let i = coinsDrop.length - 1; i >= 0; i--) {
    const c = coinsDrop[i];
    c.rot += dt * 5; c.life -= dt;
    const dx = player.x - c.x; const dy = player.y - c.y; const d = Math.hypot(dx, dy) || 1;
    if (d < player.pickupR) { c.x += (dx/d) * 1200 * dt; c.y += (dy/d) * 1200 * dt; } 
    else { c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= 0.95; c.vy *= 0.95; }
    if (d < player.r + 15 || c.life <= 0) {
      if (c.life > 0) { S.coins++; beep(rand(1000,1200), 0.05, "sine", 0.02, 1500); }
      coinsDrop.splice(i, 1);
    }
  }

  S.spawnTimer -= dt;
  if (S.spawnTimer <= 0 && !S.bossIntroPause && !grimReaper) {
    if (S.madnessTimer > 0) {
      S.spawnTimer = 0.05; for (let i = 0; i < 3; i++) spawnEnemy();
    } else {
      let baseInterval = Math.max(0.3, 0.9 - S.elapsed * 0.01); 
      let modeMult = 1.0;
      if (player.bulletMode === 0) modeMult = 1.8; 
      else if (player.bulletMode === 1) modeMult = 0.65; 
      else if (player.bulletMode === 2) modeMult = 1.3; 

      if (boss) { S.spawnTimer = 2.5; } 
      else { S.spawnTimer = (baseInterval * modeMult * rand(0.8, 1.2)); } 
      const batch = 1 + Math.floor(S.elapsed / 50);
      for (let i = 0; i < batch; i++) spawnEnemy();
    }
  }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    let gone=b.life<=0||b.x<-40||b.x>W+40||b.y<-40||b.y>H+40;
    
    if(!gone && boss && !boss.dead && !boss.invulnerable) {
      if (!b.hits.has(boss) && d2(b.x, b.y, boss.x, boss.y) < (boss.r + b.r) * (boss.r + b.r)) {
        let dmg = b.dmg; const crit = Math.random() < player.crit; if (crit) dmg *= player.critMul;
        b.hits.add(boss); dealDamageToBoss(dmg, crit); explode(b.x, b.y, "#e0f2fe", 3, 120);
        if (b.hits.size > b.pierce) gone = true;
      }
    }

    if(!gone && pillars.length > 0) {
      for(let p of pillars) {
        if(p.dead || b.hits.has(p)) continue;
        if(d2(b.x, b.y, p.x, p.y) < (p.r + b.r) * (p.r + b.r)) {
          b.hits.add(p); dealDamageToPillar(p, b.dmg); explode(b.x, b.y, "#fbbf24", 3, 120);
          if (b.hits.size > b.pierce) { gone = true; break; }
        }
      }
    }

    if(!gone && boss && boss.minions) {
      for(let m of boss.minions) {
        if(m.dead || b.hits.has(m)) continue;
        if(d2(b.x, b.y, m.x, m.y) < (m.r + b.r) * (m.r + b.r)) {
          b.hits.add(m); dealDamageToMinion(m, b.dmg); explode(b.x, b.y, "#888", 3, 120);
          if (b.hits.size > b.pierce) { gone = true; break; }
        }
      }
    }
    
    if(!gone && grimReaper && grimReaper.state === "active") {
      if (!b.hits.has(grimReaper) && d2(b.x, b.y, grimReaper.x, grimReaper.y) < (grimReaper.r + b.r) * (grimReaper.r + b.r)) {
        b.hits.add(grimReaper); dealDamageToReaper(b.dmg, false); explode(b.x, b.y, "#e0f2fe", 3, 120);
        if (b.hits.size > b.pierce) gone = true;
      }
    }

    if(!gone){
      for(let j=0;j<enemies.length;j++){
        const e=enemies[j];
        if(e.dead||b.hits.has(e))continue;
        const rr=b.r+e.r;
        if(d2(b.x,b.y,e.x,e.y)<rr*rr){
          let dmg=b.dmg; const crit=Math.random()<player.crit; if(crit)dmg*=player.critMul;
          b.hits.add(e); damageEnemy(e,dmg,crit); explode(b.x,b.y,b.color,3,120);
          if(b.hits.size>b.pierce){gone=true;break;}
        }
      }
    }
    if(gone)bullets.splice(i,1);
  }

  for(const e of enemies){
    if(e.dead)continue;
    let dx=player.x-e.x,dy=player.y-e.y;
    const d=Math.hypot(dx,dy)||1;
    dx/=d;dy/=d;
    let mx=dx,my=dy;
    if(e.wob){const w=Math.sin(S.time*3+e.phase)*.6;mx+=-dy*w;my+=dx*w;}
    e.x+=mx*e.speed*dt;e.y+=my*e.speed*dt;e.rot+=e.rotSpd*dt;
    if(e.flash>0)e.flash-=dt;
    const rr=e.r+player.r;
    if(d2(e.x,e.y,player.x,player.y)<rr*rr){
      if(player.inv<=0)hurtPlayer(e.dmg);
      killEnemy(e);
    }
  }

  const en=enemies.length;
  if(en<130){
    for(let i=0;i<en;i++){
      const a=enemies[i];if(a.dead)continue;
      for(let j=i+1;j<en;j++){
        const b=enemies[j];if(b.dead)continue;
        const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,dd=dx*dx+dy*dy;
        if(dd<rr*rr&&dd>.01){
          const d=Math.sqrt(dd),push=((rr-d)/d)*.42;
          a.x-=dx*push;a.y-=dy*push;b.x+=dx*push;b.y+=dy*push;
        }
      }
    }
  }

  for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead)enemies.splice(i,1);

  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i];o.rot+=dt*3;
    const dx=player.x-o.x,dy=player.y-o.y,d=Math.hypot(dx,dy)||1;
    if(d<player.pickupR){ const pull=300+(1-d/player.pickupR)*1100; o.x+=(dx/d)*pull*dt;o.y+=(dy/d)*pull*dt; }
    else{o.x+=o.vx*dt;o.y+=o.vy*dt;o.vx*=.955;o.vy*=.955;}
    if(d<player.r+10){
      orbs.splice(i,1);
      const decay = Math.max(0.1, 1 - S.level * 0.015); 
      S.exp += o.v * decay * player.expGain;
      beep(rand(900,1150),.05,"sine",.025,1500);
    }
  }

  for(let i=rings.length-1;i>=0;i--){
    const w=rings[i];w.life-=dt;
    const p=1-w.life/w.max;
    w.r=20+(w.maxR-20)*(1-Math.pow(1-p,2.2));
    if(w.life<=0)rings.splice(i,1);
  }

  if(tryLevelUp())handleLevelUp();
}

function tryLevelUp(){
  if(S.state!=="playing")return false;
  if(S.exp<S.expNext)return false;
  S.exp-=S.expNext;S.level++;S.expNext=expForLevel(S.level);
  return true;
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }
}
function updateTexts(dt){
  for(let i=texts.length-1;i>=0;i--){
    const t=texts[i]; t.y+=t.vy*dt;t.vy*=.93;t.life-=dt;
    if(t.life<=0)texts.splice(i,1);
  }
}

function drawBG(){
  ctx.fillStyle="#05060f";ctx.fillRect(0,0,W,H);
  
  if (S.state === "modeSelect") {
    drawGearBackground();
    return;
  }
  
  if (S.state === "menu") {
    const time = S.time;
    
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 4; i++) {
      const cx = W/2 + Math.cos(time * 0.25 + i * 1.5) * W * 0.5;
      const cy = H/2 + Math.sin(time * 0.4 + i * 1.5) * H * 0.5;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W,H) * 0.6);
      const colors = ["rgba(0, 255, 255, 0.25)", "rgba(168, 85, 247, 0.25)", "rgba(244, 63, 94, 0.2)", "rgba(56, 189, 248, 0.25)"];
      g.addColorStop(0, colors[i]);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    }
    ctx.globalCompositeOperation = "source-over";
    
    ctx.strokeStyle = "rgba(0, 255, 255, 0.15)";
    ctx.lineWidth = 1.5;
    const horizon = H * 0.6;
    const offset = (time * 60) % 60;
    ctx.beginPath();
    for (let x = -W; x < W*2; x += 100) {
      ctx.moveTo(W/2, horizon); ctx.lineTo(x, H);
    }
    for (let y = horizon; y < H + 60; y += 60) {
      const yy = y + offset;
      if(yy < H) { ctx.moveTo(0, yy); ctx.lineTo(W, yy); }
    }
    ctx.stroke();
    
    for (const st of stars) {
      ctx.fillStyle = `rgba(200, 255, 255, ${0.4 + st.z * 0.6})`;
      const sz = st.s * 2;
      ctx.fillRect(st.x, st.y, sz, sz);
    }
    
    if (Math.random() < 0.05) {
      shootingStars.push({ x: rand(0, W), y: -50, vx: rand(-150, 150), vy: rand(400, 800), life: 1, max: 1 });
    }
    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i];
      s.x += s.vx * 0.016; s.y += s.vy * 0.016; s.life -= 0.015;
      ctx.strokeStyle = `rgba(0, 255, 255, ${s.life})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx * 0.04, s.y - s.vy * 0.04);
      ctx.stroke();
      if(s.life <= 0) shootingStars.splice(i,1);
    }
  } else {
    const nebs=[{x:.18,y:.25,r:.55,c:"rgba(56,189,248,0.055)"},{x:.82,y:.7,r:.6,c:"rgba(167,139,250,0.055)"},{x:.55,y:.12,r:.45,c:"rgba(244,114,182,0.04)"}];
    for(const nb of nebs){
      const cx=nb.x*W,cy=nb.y*H,r=nb.r*Math.max(W,H)*.7;
      const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      g.addColorStop(0,nb.c);g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    }
    for(const st of stars){
      const a=.15+st.z*.55;
      ctx.fillStyle="rgba(200,222,255,"+a+")";
      const s=st.s*(.6+st.z*.8);
      ctx.fillRect(st.x,st.y,s,s);
    }
  }
}

function drawBlackHole(){
  if(!blackHole) return;
  const bh = blackHole;
  const a = clamp(bh.life / bh.max, 0, 1);
  ctx.save();
  ctx.translate(bh.x, bh.y);
  ctx.globalCompositeOperation = "source-over";
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, bh.r);

  g.addColorStop(0.5, "rgba(15,4,35,0.96)");
  g.addColorStop(0.82, "rgba(120,40,220,0.5)");
  g.addColorStop(1, "rgba(168,85,247,0)");
  ctx.globalAlpha = a;

  ctx.globalCompositeOperation = "lighter";

    ctx.stroke();

  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

function drawPlayer(){
  if(!player||S.state==="dead")return;
  const ang=Math.atan2(mouse.y-player.y,mouse.x-player.x);
  const blink=player.inv>0&&Math.floor(S.time*22)%2===0;
  
  const cData = COLOR_STAGES[player.colorStage];
  let scale = 1;
  let alpha = blink ? .35 : 1;

  if (player.bulletMode === 2 && player.charId === 0) {
    const cycle = 2.0 * (640 / player.bulletSpeed);
    const phase = (player.breathTimer % cycle) / cycle;
    scale = 1 + Math.sin(phase * Math.PI) * 0.5; alpha = 0.7 + Math.sin(phase * Math.PI) * 0.3; 
  }

  ctx.save(); ctx.translate(player.x,player.y); ctx.rotate(ang); ctx.globalAlpha=alpha;
  ctx.globalCompositeOperation="lighter";
  
  const flame=16+Math.sin(S.time*40)*5;
  let flameColor = cData.flame;
  if (player.charId === 1) flameColor = "rgba(244,114,182,0.85)";
  if (player.charId === 2) flameColor = "rgba(168,85,247,0.9)";
  const fg=ctx.createLinearGradient(-8,0,-8-flame,0);
  fg.addColorStop(0,flameColor);fg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.beginPath();ctx.moveTo(-8,-5);ctx.lineTo(-8-flame,0);ctx.lineTo(-8,5);ctx.closePath(); ctx.fillStyle=fg;ctx.fill();
  
  let glowColor = cData.glow;
  if (player.charId === 1) glowColor = "#f472b6";
  if (player.charId === 2) glowColor = "#a855f7";
  ctx.globalAlpha=alpha*.28;
  ctx.beginPath();ctx.arc(0,0,player.r*2.1*scale,0,TAU); ctx.fillStyle=glowColor;ctx.fill();
  
  ctx.globalAlpha=alpha; ctx.globalCompositeOperation="source-over";
  
  if (player.charId === 1) {
    const mainColor = "#f472b6";
    const accentColor = "#c084fc";
    ctx.beginPath();
    ctx.moveTo(17, 0);
    ctx.lineTo(5, 10);
    ctx.lineTo(-8, 9);
    ctx.lineTo(-8, -9);
    ctx.lineTo(5, -10);
    ctx.closePath();
    ctx.fillStyle = mainColor;
    ctx.shadowColor = mainColor;
    ctx.shadowBlur = 16;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,255,255,.9)";
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.beginPath(); ctx.arc(2, 0, 6, 0, TAU);
    ctx.fillStyle = "rgba(192,132,252,0.7)"; ctx.fill();
    ctx.beginPath(); ctx.arc(2, 0, 2.5, 0, TAU);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.beginPath(); ctx.arc(-1, 9, 3, 0, TAU); ctx.fillStyle = accentColor; ctx.fill();
    ctx.beginPath(); ctx.arc(-1, -9, 3, 0, TAU); ctx.fillStyle = accentColor; ctx.fill();
    ctx.strokeStyle = "rgba(192,132,252,0.8)"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-1, 6); ctx.lineTo(-1, -6); ctx.stroke();
  } else if (player.charId === 2) {
    const mainColor = "#a855f7";
    ctx.beginPath();
    ctx.moveTo(18, 0);
    ctx.lineTo(4, 11);
    ctx.lineTo(-10, 8);
    ctx.lineTo(-10, -8);
    ctx.lineTo(4, -11);
    ctx.closePath();
    ctx.fillStyle = "#2e1065";
    ctx.shadowColor = mainColor;
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = mainColor;
    ctx.lineWidth = 1.8;
    ctx.stroke();

    ctx.beginPath(); ctx.arc(2, 0, 5.5, 0, TAU);
    ctx.fillStyle = "#000"; ctx.fill();
    ctx.strokeStyle = "#c084fc"; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.beginPath();
    ctx.arc(2, 0, 9.5, S.time * 2, S.time * 2 + Math.PI * 1.25);
    ctx.strokeStyle = "rgba(192,132,252,.85)";
    ctx.lineWidth = 1.6;
    ctx.stroke();
  } else {
    ctx.beginPath();ctx.moveTo(17,0);ctx.lineTo(-10,9.5);ctx.lineTo(-4,0);ctx.lineTo(-10,-9.5);ctx.closePath();
    ctx.fillStyle=cData.main;ctx.shadowColor=cData.glow;ctx.shadowBlur=16;ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=1.4;ctx.stroke();
  }
  
  ctx.restore(); ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
}

function drawDrones(){
  for(const d of drones){
    const a = d.life / d.max;
    ctx.save();
    ctx.translate(d.x, d.y);

    ctx.beginPath();
    ctx.moveTo(10, 0); ctx.lineTo(-6, 7); ctx.lineTo(-3, 0); ctx.lineTo(-6, -7);
    ctx.closePath();
    ctx.fillStyle = "#e9d5ff";
    ctx.strokeStyle = "#c084fc";
    ctx.lineWidth = 1.5;
